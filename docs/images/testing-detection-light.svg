<svg xmlns='http://www.w3.org/2000/svg' width='760' height='248' viewBox='0 0 760 248' role='img' aria-label='How soon the network doctor raises a fault added to real history' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif'><title>How soon the network doctor raises a fault added to real history</title><rect width='760' height='248' rx='12' fill='#fcfcfb'/><text x='24' y='34' fill='#0b0b0b' font-size='18' text-anchor='start' font-weight='600'>How soon a fault is noticed</text><text x='24' y='58' fill='#52514e' font-size='13' text-anchor='start' font-weight='400'>A fault added to the real history of 3 home networks, slowest of the three</text><text x='24' y='91' fill='#0b0b0b' font-size='14' text-anchor='start' font-weight='400'>6 devices drop together</text><text x='24' y='108' fill='#52514e' font-size='12' text-anchor='start' font-weight='400'>H06</text><path d='M270,80 h13.272727272727273 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-13.272727272727273 z' fill='#2a78d6'/><text x='295.27272727272725' y='95' fill='#0b0b0b' font-size='13' text-anchor='start' font-weight='400'>1-2 min</text><text x='24' y='137' fill='#0b0b0b' font-size='14' text-anchor='start' font-weight='400'>Gateway answers 3 ms slower</text><text x='24' y='154' fill='#52514e' font-size='12' text-anchor='start' font-weight='400'>H07</text><path d='M270,126 h108.27272727272728 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-108.27272727272728 z' fill='#2a78d6'/><text x='390.27272727272725' y='141' fill='#0b0b0b' font-size='13' text-anchor='start' font-weight='400'>10-13 min</text><text x='24' y='183' fill='#0b0b0b' font-size='14' text-anchor='start' font-weight='400'>A device restarts every 10 min</text><text x='24' y='200' fill='#52514e' font-size='12' text-anchor='start' font-weight='400'>H05</text><path d='M270,172 h376.0 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-376.0 z' fill='#2a78d6'/><text x='658.0' y='187' fill='#0b0b0b' font-size='13' text-anchor='start' font-weight='400'>43-44 min</text><text x='24' y='226' fill='#52514e' font-size='13' text-anchor='start' font-weight='400'>Not raised: a phone whose Wi-Fi sleeps, a gateway 2 ms slower.</text></svg>
