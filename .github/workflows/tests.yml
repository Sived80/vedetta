name: Tests

on:
  push:
    branches:
      - main
      - release/**
      - ci/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04    # 26.04 (the new ubuntu-latest, from 19/10/2026) breaks the two export golden tests: to study
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262    # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065    # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: vedetta/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020    # v4.4.0
        with:
          node-version: "22"
      - run: pip install -r vedetta/requirements.txt
      - run: npm ci
        working-directory: tests/ui
      - run: python tools/run_tests.py
