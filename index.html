  .tiles[hidden] { display: none; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }

  /* Tile card */
  .tile {
    --c: var(--state-icon-color);
    display: grid; grid-template-columns: 40px minmax(0, 1fr); grid-template-areas: "ic body" "bar bar";
    column-gap: 12px; row-gap: 12px; padding: 12px; cursor: pointer; outline: none;
    background: var(--card-background-color); border: 1px solid var(--divider-color); border-radius: var(--ha-card-border-radius);
    box-shadow: var(--ha-card-box-shadow);
    transition: background-color 0.2s, box-shadow 0.2s, border-color 0.2s, transform 0.12s;
    animation: tile-in 0.3s ease-out backwards;
  }
  .tile:hover { background: color-mix(in srgb, var(--card-background-color) 94%, var(--primary-text-color)); }
  .tile:focus-visible { box-shadow: 0 0 0 2px var(--primary-color); }
  .tile:active { transform: scale(0.99); }
  .tile.online { --c: var(--primary-color); }
  /* Icon colour by device type (like HA tiles, where each domain has its colour); offline stays disabled grey. */
  .tile.online[data-type="router"], .crow.online[data-type="router"] { --c: #29b6f6; }
  .tile.online[data-type="server"], .crow.online[data-type="server"] { --c: #7e57c2; }
  .tile.online[data-type="pc"], .crow.online[data-type="pc"] { --c: #5c6bc0; }
  .tile.online[data-type="phone"], .crow.online[data-type="phone"] { --c: #ff7043; }
  .tile.online[data-type="audio"], .crow.online[data-type="audio"] { --c: #26a69a; }
  .tile.online[data-type="iot"], .crow.online[data-type="iot"] { --c: #66bb6a; }
  .tile.online[data-type="printer"], .crow.online[data-type="printer"] { --c: #8d6e63; }
  .tile.online[data-type="media"], .crow.online[data-type="media"] { --c: #ec407a; }
  .tile.online[data-type="generic"], .crow.online[data-type="generic"] { --c: #78909c; }
  .tile-icon {
    grid-area: ic; position: relative; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    color: var(--c); background: color-mix(in srgb, var(--c) 20%, transparent); transition: background-color 0.3s, color 0.3s;
  }
  .tile.offline .tile-icon { color: var(--disabled-text-color); background: color-mix(in srgb, var(--secondary-text-color) 14%, transparent); }
  .ic { display: grid; place-items: center; }
  .ring { display: none; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid transparent; border-top-color: var(--warning-color); }
  .tile.scanning .ring { display: block; animation: spin 1s linear infinite; }
  .tile-icon.flash-on { animation: flash-on 0.9s ease-out; }
  .tile-icon.flash-off { animation: flash-off 0.9s ease-out; }
  /* A device flagged for the report: small flag on the corner of its icon. */
  .tile-flag { position: absolute; right: -4px; bottom: -4px; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: var(--primary-color); color: var(--text-primary-color, #fff); box-shadow: 0 0 0 2px var(--card-background-color); }
  .tile-flag .mdi { width: 12px; height: 12px; }
  /* Signs of the state on the corners of the icon (analysis/badges.py): one per corner, two at most; always a shape beside the colour. */
  .tile-mark { position: absolute; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    color: var(--card-background-color); box-shadow: 0 0 0 2px var(--card-background-color); }
  .tile-mark.tr { right: -5px; top: -5px; }
  .tile-mark.br { right: -5px; bottom: -5px; }
  /* The flag of the report keeps the bottom right corner, as it always had: a card that is flagged and settling shows the clock on the bottom left. */
  .tile.flagged .tile-mark.br { right: auto; left: -5px; }
  .tile-mark.analysing { background: var(--warning-color); }
  .tile-mark.settling { background: var(--secondary-text-color); }
  .tile-mark.unresolved { background: var(--primary-text-color); }
  .tile-mark .mdi { width: 12px; height: 12px; }
  /* Right padding: room for the open button (34px), and for the wake button too when it is shown (68px). */
  .tile-body { grid-area: body; display: flex; flex-direction: column; min-width: 0; padding-right: 34px; }
  .tile:has(.tile-wake:not([hidden])) .tile-body { padding-right: 68px; }
  .tile-name { font-size: 14px; line-height: 20px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile-ip { font-size: 12px; line-height: 16px; color: var(--secondary-text-color); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tile-state { font-size: 12px; line-height: 16px; color: var(--secondary-text-color); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile.online .tile-state { color: var(--success-text-color); }
  .tile-sub { font-size: 12px; line-height: 16px; color: var(--secondary-text-color); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Left of the open button (.tile-open, overrides layer). */
  .tile-wake { position: absolute; top: 2px; right: 36px; }
  /* 24 h bar: thin, segmented, empty when there is no data */
  .hbar { grid-area: bar; position: relative; height: 4px; border-radius: 2px; overflow: hidden; display: block; background: transparent; }
  .hbar.nodata { visibility: hidden; }
  .hbar i { position: absolute; top: 0; bottom: 0; border-radius: 2px; box-shadow: 0 0 0 0.5px var(--card-background-color); }
  .hbar i.on { background: var(--success-color); opacity: 0.65; }
  .hbar i.off { background: var(--error-color); }

  /* Compact-mode list */
  .compact-list .crows { padding: 0 8px 8px; }
  .crow {
    --c: var(--state-icon-color);
    display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 8px; border-radius: 8px; cursor: pointer; outline: none;
  }
  .crow:hover { background: var(--ha-hover); }
  .crow.online { --c: var(--primary-color); }
  .crow .tile-icon { flex: none; width: 36px; height: 36px; }
  .crow.offline .tile-icon { color: var(--disabled-text-color); background: color-mix(in srgb, var(--secondary-text-color) 14%, transparent); }
  .crow.online .tile-state { color: var(--success-text-color); }
  .crow-body { display: flex; flex-direction: column; min-width: 0; }
  .crow-empty { padding: 16px 8px; color: var(--secondary-text-color); }
  .crow-more {
    display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px;
    border-top: 1px solid var(--divider-color); color: var(--primary-color); text-decoration: none; font-weight: 500;
  }
  .crow-more .mdi { width: 18px; height: 18px; }

  /* Empty states */
  .empty-state { padding: 40px 24px; text-align: center; }
  .empty-ic {
    width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 50%; display: grid; place-items: center;
    color: var(--primary-color); background: color-mix(in srgb, var(--primary-color) 14%, transparent);
  }
  .empty-ic .mdi { width: 36px; height: 36px; }
  .empty-ic.err { color: var(--error-color); background: color-mix(in srgb, var(--error-color) 14%, transparent); }
  /* Scan button of the empty state: the circle with the magnifier above the title. It blinks while scanning (nd-blink, 10-base). */
  button.empty-ic.scan { border: none; cursor: pointer; font: inherit; transition: transform 0.15s, background-color 0.2s; }
  button.empty-ic.scan:disabled { cursor: default; }
  button.empty-ic.scan.busy { animation: nd-blink 0.9s ease-in-out infinite; }
  .empty-state h3 { font-size: 20px; line-height: 28px; font-weight: 500; }
  .empty-state p { max-width: 420px; margin: 8px auto 0; color: var(--secondary-text-color); }
}

@layer overrides {
  /* Scan button: hover and press. */
  button.empty-ic.scan:hover:not(:disabled) { transform: scale(1.05); background: color-mix(in srgb, var(--primary-color) 22%, transparent); }
  button.empty-ic.scan:active:not(:disabled) { transform: scale(0.97); }
  @media (prefers-reduced-motion: reduce) {
    button.empty-ic.scan.busy { animation: none; }
  }

  /* Focus ring of tiles and compact rows. */
  .tile:focus-visible, .crow:focus-visible { outline: 2px solid var(--focus-color); outline-offset: 2px; box-shadow: none; }

  /* Connect button in every tile (top right); grey when offline. In this layer so its colour beats .icon-btn:hover (components). */
  .tile-open { position: absolute; top: 2px; right: 2px; color: var(--primary-color); }
  .tile-open.off { color: var(--disabled-text-color); cursor: default; }
  .tile-open.off:hover { background: transparent; }

  /* List view (menu > View > List): each group is a card like the HA entities card, one row per device. Same elements as the
     tiles, in columns: icon | name | IP | status and ms | role and brand | last 24 h | actions. In this layer, because it must beat
     .tile-open and the focus ring above. */
  html[data-view="list"] .tiles {
    display: block; background: var(--card-background-color); border: 1px solid var(--divider-color);
    border-radius: var(--ha-card-border-radius); overflow: hidden;
  }
  html[data-view="list"] .tile {
    grid-template-columns: 36px minmax(0, 2fr) minmax(112px, 1fr) minmax(0, 1.3fr) minmax(0, 1.7fr) 72px 40px 40px;
    grid-template-areas: none; align-items: center; column-gap: 16px; row-gap: 0;
    min-height: 56px; padding: 6px 8px 6px 16px; border: 0; border-radius: 0; box-shadow: none; animation: none;
  }
  html[data-view="list"] .tile + .tile { border-top: 1px solid var(--divider-color); }
  html[data-view="list"] .tile:active { transform: none; }
  html[data-view="list"] .tile:focus-visible { outline-offset: -2px; }
  html[data-view="list"] .tile-body { display: contents; }
  html[data-view="list"] .tile > *, html[data-view="list"] .tile-body > * { grid-row: 1; }
  html[data-view="list"] .tile-icon { grid-area: auto; grid-column: 1; width: 36px; height: 36px; }
  html[data-view="list"] .tile-name { grid-column: 2; }
  html[data-view="list"] .tile-ip { grid-column: 3; }
  html[data-view="list"] .tile-state { grid-column: 4; }
  html[data-view="list"] .tile-sub { grid-column: 5; }
  /* A hidden role line (display: none from the reset) still counts as hidden. */
  html[data-view="list"] .tile-sub[hidden] { visibility: hidden; }
  html[data-view="list"] .hbar { grid-area: auto; grid-column: 6; }
  html[data-view="list"] .tile-wake { position: static; grid-column: 7; }
  html[data-view="list"] .tile-open { position: static; grid-column: 8; }
  @media (max-width: 700px) {
    /* Narrow screens: icon | name with the IP below | status | open */
    html[data-view="list"] .tile { grid-template-columns: 36px minmax(0, 1fr) auto 40px; padding: 8px 4px 8px 12px; column-gap: 12px; }
    html[data-view="list"] .tile-icon { grid-row: 1 / span 2; }
    html[data-view="list"] .tile-ip { grid-column: 2; grid-row: 2; }
    html[data-view="list"] .tile-state { grid-column: 3; grid-row: 1 / span 2; text-align: right; }
    html[data-view="list"] .tile-sub, html[data-view="list"] .hbar { display: none; }
    /* Every row the same height; the open button spans both lines and is centred. With a wake button the two stack, as before. */
    html[data-view="list"] .tile { min-height: 64px; align-content: center; }
    html[data-view="list"] .tile-open { grid-column: 4; grid-row: 1 / span 2; align-self: center; }
    html[data-view="list"] .tile:has(.tile-wake:not([hidden])) .tile-open { grid-row: 1; align-self: end; }
    html[data-view="list"] .tile-wake { grid-column: 4; grid-row: 2; align-self: start; }
  }

  /* Brand logos. Cards: a big faint logo on the right, cut by the edge and fading to the left. List and compact rows: the logo
     replaces the icon in the circle, tinted with the brand colour. No logo, nothing shown. */
  .brand-big { position: absolute; right: -36px; top: 50%; transform: translateY(-50%); width: 170px; height: 170px; opacity: 0.14;
    pointer-events: none; color: var(--primary-text-color);
    -webkit-mask-image: linear-gradient(to left, #000 40%, transparent 100%); mask-image: linear-gradient(to left, #000 40%, transparent 100%); }
  .brand-big i { display: block; width: 100%; height: 100%; background: currentColor;
    -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat; }
  [data-view="list"] .brand-big { display: none; }
  .crow .tile-icon.has-logo, [data-view="list"] .tile .tile-icon.has-logo { background: color-mix(in srgb, var(--bc) 22%, transparent); color: var(--bc); }
  .crow.offline .tile-icon.has-logo, [data-view="list"] .tile.offline .tile-icon.has-logo {
    background: color-mix(in srgb, var(--secondary-text-color) 14%, transparent); color: var(--disabled-text-color);
  }
  [data-view="list"] .tile .tile-icon.has-logo .ic svg { display: none; }
  .crow .tile-icon.has-logo .ic, [data-view="list"] .tile .tile-icon.has-logo .ic { display: block; width: 22px; height: 22px; background: currentColor;
    -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat; }

  /* Debug mode: the battery line of a tile is orange (HA warning colour); !important beats its inline opacity. */
  html[data-debug] .tile-batt { color: var(--warning-text-color); opacity: 1 !important; }
}
/* Devices found panel (#card-new, inside the network card). Its .nd-list/.nd-row/.nd-ic/.nd-text/.nd-actions rows are reused by the #ignored dialog
   (network): the plain .nd-* rules below style that dialog, #card-new restyles them in the overrides layer. */

@layer layout {
  /* Compact mode (?compact=1): no devices found card. */
  html[data-compact] #card-new { display: none; }
}

@layer components {
  /* The card: a ring in the icon of each row, a bar of two buttons in line with the title or aligned with row actions,
     nothing moves when a button is pressed (the two cells of buttons, --c1 and --c2, have identical widths and gap
     in the bar and in the rows; the progress bar has its place). */
  #card-new {
    --c1: 36px; --c2: 36px; --nd-gap: 6px; overflow: clip;
  }

  /* Device rows: Add and Ignore together, wrapping on narrow screens. */
  .nd-list { padding: 4px 8px; }
  .nd-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 6px 8px; min-height: 52px; }
  .nd-ic { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none;
    color: var(--warning-color); background: color-mix(in srgb, var(--warning-color) 16%, transparent); }
  .nd-ic .mdi { width: 20px; height: 20px; }
  .nd-text { flex: 1; min-width: 0; }
  .nd-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nd-sub { font-size: 12px; color: var(--secondary-text-color); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nd-actions { display: flex; align-items: center; gap: var(--nd-gap, 6px); margin-left: auto; }
}

@layer overrides {
  /* Panel of the network card: a divided block between the badges and the brands, not a card. Title and bar of buttons in one
     line (they wrap on narrow widths); the MAC is never cut: the actions go under the text when there is no room. */
  #card-new { border-top: 1px solid var(--divider-color); border-bottom: 1px solid var(--divider-color); padding: 12px 0 0; }
  #card-new[hidden] { display: none; }
  #card-new .card-header { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding: 0 0 8px; min-height: 0; }
  #card-new .card-header .ch-text { flex: 1 1 140px; min-width: 0; }
  /* the same size as the rest of the card text: these beat the 24px of the card title (#card-network .card-header .ch-title) */
  #card-network #card-new .card-header .ch-title { font-size: var(--ha-font-size-m, 14px); line-height: 20px; font-weight: var(--ha-font-weight-medium, 500); }
  #card-network #card-new .card-header .ch-sub { font-size: var(--ha-font-size-s, 12px); line-height: 16px; margin-top: 2px; color: var(--secondary-text-color); }
  /* the icon of the title has the size of the icon of the rows (36 px, 20 px glyph) */
  #card-network #card-new .ch-ic { width: 36px; height: 36px; margin: 0; }
  #card-network #card-new .ch-ic .mdi { width: 20px; height: 20px; }
  #card-new .ch-ic.ok { color: var(--success-color); background: color-mix(in srgb, var(--success-color) 18%, transparent); }
  #card-new .nd-bar-actions, #card-new .nd-actions {
    display: grid; grid-template-columns: var(--c1) var(--c2); gap: var(--nd-gap, 6px); align-items: center; justify-content: end; margin-left: auto; flex: none;
  }
  #card-new .nd-bar-actions > *, #card-new .nd-actions > * { min-height: 36px; display: flex; align-items: center; justify-content: center; min-width: 0; }
  #card-new .nd-bar-actions > .btn, #card-new .nd-actions > .btn {
    width: 36px; height: 36px; min-height: 36px; padding: 0; background: transparent; border: 0; color: var(--secondary-text-color); box-sizing: border-box; white-space: nowrap;
    font-size: var(--ha-font-size-s, 12px); font-weight: var(--ha-font-weight-medium, 500); border-radius: 50%;
  }
  #card-new .nd-bar-actions > .btn:disabled { opacity: 0.7; }
  #card-new .nd-list { padding: 0; }
  #card-new .nd-row { flex-wrap: wrap; min-height: 56px; box-sizing: border-box; padding: 6px 0; gap: 4px 12px; }
  #card-new .nd-text { flex: 1 1 130px; }
  #card-new .nd-sub { overflow: visible; text-overflow: clip; white-space: normal; overflow-wrap: anywhere; }
  #card-new .nd-status { padding: 0; font-size: 13px; color: var(--secondary-text-color); }
  /* Plain icon buttons as in HA: no background, the 24 px icon centred in 36 px, like the three lines of the menu (same right edge as
     the menu button: on narrow windows the header padding is 12 and the content 16, hence the 4 px). The action that adds is blue. */
  #card-new .nd-sym .mdi, #card-new .nd-sym svg { width: 24px; height: 24px; top: 0; }
  #card-new .nd-sym:hover { background: var(--ha-hover); color: var(--primary-text-color); }
  #card-new .nd-sym.nd-ok { color: var(--primary-color); }
  @media (max-width: 440px) {
    #card-new { --c1: 32px; --c2: 32px; }
    #card-new .nd-bar-actions > .btn, #card-new .nd-actions > .btn { width: 32px; height: 32px; min-height: 32px; }
    #card-new .nd-bar-actions, #card-new .nd-actions { margin-right: -4px; }
  }
  /* the ring */
  #card-new .nd-row.nd-run .nd-ic, #card-new .nd-row.nd-save .nd-ic, #card-new .nd-row.nd-done .nd-ic { background: transparent; }
  .nd-ring { width: 30px; height: 30px; }
  .nd-ring circle { fill: none; stroke-width: 3; }
  .nd-ring .tr { stroke: var(--divider-color); }
  .nd-ring .sp { stroke: var(--primary-color); stroke-linecap: round; stroke-dasharray: 50 100; transform-origin: 50% 50%; animation: nd-spin 0.9s linear infinite; }
  .nd-ring .close { stroke: var(--primary-color); stroke-linecap: round; stroke-dasharray: 82; stroke-dashoffset: 82; transform: rotate(-90deg); transform-origin: 50% 50%; animation: nd-draw 0.7s linear forwards; }
  .nd-ring .full { stroke: var(--success-color); stroke-dasharray: 82; stroke-dashoffset: 0; transform: rotate(-90deg); transform-origin: 50% 50%; }
  .nd-ring .full.fresh { stroke-dashoffset: 82; animation: nd-draw 0.45s ease-out forwards; }
  .nd-ring .tick { fill: none; stroke: var(--success-color); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; stroke-dashoffset: 0; }
  .nd-ring .tick.fresh { stroke-dashoffset: 20; animation: nd-draw 0.35s 0.3s ease-out forwards; }
  .nd-mini { width: 18px; height: 18px; }
  .nd-mini circle { fill: none; stroke-width: 4; }
  .nd-mini .tr { stroke: var(--divider-color); }
  .nd-mini .sp { stroke: var(--primary-color); stroke-linecap: round; stroke-dasharray: 50 100; transform-origin: 50% 50%; animation: nd-spin 0.9s linear infinite; }
  @keyframes nd-spin { to { transform: rotate(360deg); } }
  @keyframes nd-draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .nd-ring .sp, .nd-mini .sp { animation: none; }
  }
}
/* Update window (#updatedlg): what is going to happen before the Updates page of Home Assistant opens. The frame, the header with the X on the left and the
   buttons at the foot are those of the other windows (.more-info, .mi-header, .mi-actions). */

@layer overrides {
  #updatedlg { width: min(460px, calc(100vw - 32px)); }
  #updatedlg .upd-body { display: flex; flex-direction: column; gap: 12px; padding: 8px 24px 16px; }
  #updatedlg .upd-intro { margin: 0; font-size: var(--ha-font-size-m); line-height: 1.5; }
  #updatedlg .upd-what { font-size: var(--ha-font-size-s); font-weight: var(--ha-font-weight-medium); letter-spacing: 0.04em; text-transform: uppercase; color: var(--secondary-text-color); }
  #updatedlg .upd-steps { margin: 0; padding: 0; list-style: none; counter-reset: upd; display: flex; flex-direction: column; gap: 10px; }
  #updatedlg .upd-steps li { counter-increment: upd; display: flex; align-items: flex-start; gap: 12px; font-size: 13px; line-height: 1.5; color: var(--secondary-text-color); }
  #updatedlg .upd-steps li::before {
    content: counter(upd); flex: none; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%;
    font-size: var(--ha-font-size-xs); font-weight: var(--ha-font-weight-medium); color: var(--primary-color);
    background: color-mix(in srgb, var(--primary-color) 14%, transparent);
  }
  #updatedlg .mi-actions { padding: 12px 24px 20px; gap: 8px; }
}
/* Log card (#card-log). .log-empty is reused by the #ignored dialog (network). */

@layer layout {
  /* Compact mode (?compact=1): no log card. */
  html[data-compact] #card-log { display: none; }
}

@layer components {
  /* Log (logbook) */
  .log-list { padding: 0 8px 8px; max-height: min(340px, 45vh); overflow-y: auto; }
  .log-day { padding: 12px 8px 4px; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--secondary-text-color); }
  .log-row {
    display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 6px 8px; border: 0; border-radius: 8px;
    background: transparent; text-align: left; color: inherit; cursor: default;
  }
  button.log-row { cursor: pointer; }
  button.log-row:hover { background: var(--ha-hover); }
  .log-ic { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .log-ic .mdi { width: 18px; height: 18px; }
  .log-ic.on { color: var(--success-color); background: color-mix(in srgb, var(--success-color) 16%, transparent); }
  .log-ic.off { color: var(--error-color); background: color-mix(in srgb, var(--error-color) 16%, transparent); }
  .log-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .log-msg { overflow-wrap: anywhere; }
  .log-ago, .log-time { font-size: 12px; color: var(--secondary-text-color); }
  .log-time { font-variant-numeric: tabular-nums; align-self: flex-start; padding-top: 2px; }
  .log-row.fresh { animation: fresh 2.2s ease-out; }
  .log-empty { display: flex; align-items: center; gap: 16px; padding: 20px 8px; color: var(--secondary-text-color); }
  .log-empty .mdi { width: 32px; height: 32px; }
  .log-empty div { display: flex; flex-direction: column; }
  .log-empty b { color: var(--primary-text-color); font-weight: 500; }
}

@layer overrides {
  /* Collapsible card: the header opens it (Home Assistant card-header padding); the arrow and the level button share one
     48px column, so their centres line up. */
  #card-log .log-head { cursor: pointer; align-items: center; padding: 12px 8px 12px 16px; }
  #card-log .log-head .ch-text { flex: 1; min-width: 0; }
  #card-log .log-head:hover { background: var(--ha-hover); }
  .log-chev { display: flex; width: 48px; justify-content: center; padding: 0; color: var(--secondary-text-color); transition: transform 0.2s; }
  #card-log.is-open .log-chev { transform: rotate(180deg); }
  @media (prefers-reduced-motion: reduce) {
    .log-chev { transition: none; }
  }

  /* Service entries */
  .log-ic.svc { color: var(--secondary-text-color); background: color-mix(in srgb, var(--secondary-text-color) 14%, transparent); }
  .log-ic.svc.warn { color: var(--warning-text-color); background: color-mix(in srgb, var(--warning-color) 16%, transparent); }

  /* Open log: a slightly compact search field and the level button on one row. */
  #card-log .log-search { display: flex; align-items: center; gap: 4px; padding: 0 8px 8px 16px; }
  #card-log .log-search .search { flex: 1; min-width: 0; height: 36px; padding-left: 14px; }
  #card-log .log-search .search input { font-size: 15px; }
  .log-search #log-level-btn { flex: none; width: 48px; }
}
/* More info dialog (#more): hero, history, attributes, ports, rename and flag forms, type menu, debug rows.
   Most corrections live in the overrides layer; they stay there because the base (10-base) also has overrides-layer rules on
   the same elements (.icon-btn, .menu, tokens). */

@layer components {
  /* Flag button of the More info actions: plain icon button, no word; blue (primary theme colour) when flagged */
  .mi-flag { margin-right: auto; border: 1px solid var(--divider-color); }
  .mi-flag.on {
    color: var(--primary-color);
    border-color: var(--primary-color);
    background: color-mix(in srgb, var(--primary-color) 16%, transparent);
  }
  .mi-flag.on:hover {
    color: var(--primary-color);
    background: color-mix(in srgb, var(--primary-color) 24%, transparent);
  }

  /* The segmented buttons keep the 34 px on touch screens too (decision 18/10: one size everywhere). */
}

@layer dialog {
  /* Hero: state icon and text */
  .mi-hero { --c: var(--state-icon-color); display: flex; align-items: center; gap: 16px; padding: 12px 0 16px; }
  .mi-hero.online { --c: var(--success-color); }
  .hero-ic {
    width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; flex: none;
    color: var(--c); background: color-mix(in srgb, var(--c) 18%, transparent);
  }
  .hero-ic .mdi { width: 28px; height: 28px; }
  .hero-state { display: flex; align-items: baseline; gap: 12px; font-size: 28px; line-height: 36px; font-weight: 500; color: var(--c); }
  /* online / offline one on the other: the cell is as wide as the wider word, so what is beside it does not move */
  .hero-st { display: grid; }
  .hero-st > span { grid-area: 1 / 1; }
  .hs-hide { visibility: hidden; }
  /* The words of the state of analysis (analysis/status.py), beside the state; the colour is never alone: the words and the sign on the icon say it */
  /* The state of the analysis beside online/offline: a small rounded label (tonal blue, grey while it settles or cannot be told), a dot that pulses
     while the analysis runs and the short text with a capital letter. It is the last item of the row, so nothing moves when it changes. */
  .hero-an { flex: none; align-self: center; display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px 0 8px; border-radius: 12px; box-sizing: border-box;
    font-size: 12.5px; line-height: 1; font-weight: 500; white-space: nowrap; color: var(--primary-color); background: color-mix(in srgb, var(--primary-color) 16%, transparent); }
  .hero-an[hidden] { display: none; }
  .hero-an[data-s="settling"], .hero-an[data-s="unresolved"] { color: var(--secondary-text-color); background: color-mix(in srgb, var(--secondary-text-color) 16%, transparent); }
  .hero-an .an-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .hero-an .an-txt { display: inline-block; padding-top: 1px; }
  .hero-an .an-txt::first-letter { text-transform: uppercase; }
  .hero-an[data-s="analysing"] .an-dot { animation: an-pulse 1.4s ease-in-out infinite; }
  @keyframes an-pulse { 0%, 100% { opacity: 0.35; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .hero-an[data-s="analysing"] .an-dot { animation: none; } }
  .hero-sub { font-size: 14px; color: var(--secondary-text-color); }

  /* Sections */
  .mi-section { margin-top: 8px; }
  .mi-sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0; }
  .mi-section h3 { font-size: 16px; line-height: 24px; font-weight: 500; }

  /* Segmented buttons (history range, rename mode) */
  /* Segmented selector: the segments all have the same width (the widest one), so the two halves are symmetric, with a thin divider between them. */
  .seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--divider-color); border-radius: 17px; overflow: hidden; }
  .seg button + button { border-left: 1px solid var(--divider-color); }
  .seg button { height: 34px; padding: 2px 14px 0; border: 0; white-space: nowrap; background: transparent; color: var(--primary-color); font-size: 12.5px; font-weight: 500; }      /* the size of every button (11-components.css .btn) */
  .seg button[aria-pressed="true"] { background: color-mix(in srgb, var(--primary-color) 16%, transparent); color: var(--primary-color); }
  .seg.wide { display: grid; width: 100%; }
  .seg.wide button { height: 34px; }

  /* Statistics, timeline, axis, tooltip */
  .stats { display: flex; gap: 32px; margin: 4px 0 14px; }
  .stat { display: flex; flex-direction: column; }
  .stat-v { font-size: 24px; line-height: 32px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .stat-l { font-size: 12px; color: var(--secondary-text-color); }
  .chart { position: relative; padding-top: 4px; }
  .tl { position: relative; height: 28px; border-radius: 6px; overflow: hidden; touch-action: manipulation; }
  .tl i { position: absolute; top: 0; bottom: 0; transition: filter 0.15s; }
  .tl i:hover { filter: brightness(1.15); }
  .tl i.on { background: var(--success-color); }
  .tl i.off { background: var(--error-color); }
  .tl i.nodata { background: color-mix(in srgb, var(--secondary-text-color) 25%, transparent); }
  .axis { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; color: var(--secondary-text-color); }
  .tip {
    position: absolute; top: -6px; transform: translate(-50%, -100%); z-index: 5; pointer-events: none; white-space: pre;
    padding: 6px 10px; border-radius: 6px; font-size: 12px; line-height: 16px; background: var(--ha-snack-bg); color: var(--ha-snack-fg);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
  }
  .graph-msg { display: flex; align-items: center; gap: 12px; padding: 24px 0; color: var(--secondary-text-color); }

  /* Attributes and the signal icon (signal and latency colours: overrides layer) */
  .attr { display: flex; align-items: center; gap: 16px; min-height: 44px; padding: 4px 0; border-top: 1px solid var(--divider-color); }
  .attr dt { flex: 0 0 36%; color: var(--secondary-text-color); }
  .attr dd { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .attr-val { min-width: 0; overflow-wrap: anywhere; }
  .sig { display: inline-flex; vertical-align: middle; color: var(--secondary-text-color); }
  .sig .mdi { width: 18px; height: 18px; }

  /* Response-time line chart (under the timeline) */
  .lat-chart { margin-top: 14px; }
  .lat-head { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--secondary-text-color); margin-bottom: 4px; }
  .lat-chart svg { display: block; width: 100%; height: 56px; }
  .lat-line { fill: none; stroke: var(--primary-color); stroke-width: 1.5; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .lat-area { fill: color-mix(in srgb, var(--primary-color) 15%, transparent); stroke: none; }

  /* Port pills: an uncertain port has a dashed border (layout and category colours: overrides layer) */
  .pill.guess { border-style: dashed; }

  /* Rename form and confirmations */
  .field { position: relative; display: block; margin: 8px 0 16px; }
  .field input {
    width: 100%; height: 56px; padding: 22px 16px 6px; border: 0; border-bottom: 1px solid var(--secondary-text-color); border-radius: 4px 4px 0 0;
    background: color-mix(in srgb, var(--secondary-text-color) 10%, transparent); color: var(--primary-text-color); font-size: 16px; outline: none;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .field input:focus { border-bottom: 2px solid var(--primary-color); padding-bottom: 5px; background: color-mix(in srgb, var(--primary-color) 8%, transparent); }
  .field-label { position: absolute; left: 16px; top: 8px; font-size: 12px; line-height: 16px; color: var(--secondary-text-color); pointer-events: none; }
  .field input:focus + .field-label { color: var(--primary-color); }
  .field-caption { margin-bottom: 8px; color: var(--secondary-text-color); }
  .field-hint { margin-top: 8px; font-size: 12px; color: var(--secondary-text-color); }
  .confirm { display: flex; gap: 16px; padding: 8px 0 16px; }
  .confirm-ic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--error-color); background: color-mix(in srgb, var(--error-color) 14%, transparent); }
  .confirm p { color: var(--secondary-text-color); }

  @media (max-width: 600px) {
    /* Narrow screens: a wider label column */
    .attr dt { flex-basis: 40%; }
  }
}

@layer overrides {
  /* Edit mode of the device card: the pencils and the type arrow (.mi-ed) show only while the switch next to "Ignore" is on. */
  /* Off = the edit icons take no room: Name, Brand and Type use the whole width; with the edit on they shrink to make room for the icons.
     With the edit off the percentage and the "i" end in the column of the icons of the rows below (open, copy MAC): that column is 48 px wide
     with the glyph in its middle, the "i" is 20 px wide, hence 14 px on its right. */
  #more:not(.edit-on) .mi-ed { display: none; }
  .card-menu .menu-item { gap: 12px; }
  .card-menu .menu-check { margin-left: auto; display: flex; visibility: hidden; color: var(--primary-color); }
  .card-menu .menu-item[aria-checked="true"] .menu-check { visibility: visible; }
  /* The flag of the report has the height of the buttons next to it (34 px) and a 20 px icon, instead of the 48 px of the generic small icon button. */
  #more .mi-actions .mi-flag { width: 34px; height: 34px; }
  #more .mi-actions .mi-flag .mdi { width: 20px; height: 20px; }
  /* Rename next to the name in the More info dialog. */
  .mi-name-row { display: flex; align-items: center; gap: 2px; min-width: 0; width: 100%; }
  .mi-name-row .mi-title { min-width: 0; flex: 0 1 auto; }
  .mi-name-row .icon-btn { flex: none; color: var(--secondary-text-color); }

  /* Wake button in the hero. */
  .hero-wake { margin-left: auto; flex: none; color: var(--primary-color); }

  /* The three dots at the right end of the name row: its 48 px box shares the right edge (and so the centre of the glyph) with the attribute icons below
     (open, copy MAC): the header and the body have the same right padding (24 px, 16 px on narrow screens). */
  .mi-name-row [data-act="card-menu"] { margin-left: auto; }

  /* Visual polish: latency and signal text contrast in the light theme. */
  .lat-green, .sig-green { color: var(--success-text-color); }
  .lat-yellow, .sig-yellow { color: var(--warning-text-color); }
  .lat-red, .sig-red { color: var(--error-text-color); }

  /* Info variant of the confirm icon, and the deep search confirm row (.fl-row from the network file) in the dialog body. */
  .confirm-ic.info { color: var(--primary-color); background: color-mix(in srgb, var(--primary-color) 14%, transparent); }
  .mi-body .fl-row { padding: 0 0 8px; }

  /* Brand evidence: confirmed (declared) or plausible (inferred). */
  .ev { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 8px; font-size: 11px; line-height: 16px; vertical-align: 1px; }
  .ev-confirmed { color: var(--success-text-color); background: color-mix(in srgb, var(--success-color) 14%, transparent); }
  .ev-plausible { color: var(--warning-text-color); background: color-mix(in srgb, var(--warning-color) 14%, transparent); }

  /* Open ports: one colour per category, in tidy rows (category, then number); uncertain ones have only the number. */
  .pills { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 2px; }
  .pills .pill { display: inline-block; margin: 0; cursor: default; min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; }
  .pill.cat-web { --pc: #2196f3; }
  .pill.cat-media { --pc: #e91e63; }
  .pill.cat-remote { --pc: #9c27b0; }
  .pill.cat-iot { --pc: #4caf50; }
  .pill.cat-file { --pc: #009688; }
  .pill.cat-print { --pc: #795548; }
  .pill.cat-db { --pc: #ff5722; }
  .pill.cat-infra { --pc: #ff9800; }
  .pill.cat-vpn { --pc: #3f51b5; }
  .pill.cat-mail { --pc: #00bcd4; }
  .pill.cat-other { --pc: #9e9e9e; }

  /* Brand logo of the device sheet: big and faint, on the right (positioned against .mi, see 10-base). */
  .brand-sheet {
    position: absolute; right: -110px; top: 30px; width: 340px; height: 340px; opacity: 0.08; pointer-events: none; color: var(--primary-text-color);
    -webkit-mask-image: linear-gradient(to left, #000 40%, transparent 100%); mask-image: linear-gradient(to left, #000 40%, transparent 100%);
  }
  .brand-sheet i { display: block; width: 100%; height: 100%; background: currentColor;
    -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat; }

  /* Type dropdown in the dialog: same look as the other menus, inside the (modal) dialog. Same specificity as the .menu rules: it
     wins because this file comes after 10-base. */
  .type-menu { position: fixed; z-index: 60; width: min(260px, calc(100vw - 16px)); padding: 8px 0; overflow-y: auto; }
  .type-menu .menu-item { min-height: 44px; }
  .type-menu .menu-item .mdi { width: 24px; height: 24px; flex: none; color: var(--secondary-text-color); }
  .type-menu .menu-item[aria-checked="true"] .mdi { color: var(--primary-color); }

  /* Device sheet: More attributes dropdown (closed at first). Its arrow is the same element as the one of the "Type" row (a small
     round icon button, only not clickable by itself), so size and position are the same by construction. */
  .attr-more { border-top: 1px solid var(--divider-color); }
  .attr-more > summary {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 48px; cursor: pointer; list-style: none;
    color: var(--secondary-text-color); font-weight: 500;
  }
  .attr-more > summary::-webkit-details-marker { display: none; }
  .attr-more > summary:hover { color: var(--primary-text-color); }
  .attr-more > summary .attr-chev { pointer-events: none; color: inherit; transition: transform 0.15s; }
  .attr-more[open] > summary .attr-chev { transform: rotate(180deg); }
  .attr-more .attr:first-of-type { border-top: 0; }

  /* Everything that exists only in debug mode is orange (HA warning colour). */
  #mi-debug, #mi-debug .mi-sec-head h3, #mi-debug .attr dt, #mi-debug .attr-val,
  .attr.dbg dt, .attr.dbg dd, .attr.dbg .attr-val, .dbg-txt { color: var(--warning-text-color); opacity: 1; }
  .attr .ev { color: var(--warning-text-color); background: color-mix(in srgb, var(--warning-color) 16%, transparent); }
  .dbg-txt { margin-left: 4px; }
  #mi-debug .dbg { border-top: 1px solid color-mix(in srgb, var(--warning-color) 45%, transparent); margin-top: 8px; }
  #mi-debug .mono { font-size: 12px; }
  .batt-line { display: inline-flex; align-items: center; gap: 8px; }
  .batt-line .mdi { width: 18px; height: 18px; }

  /* Evidence in the Name, Brand and Type rows: thin bar, certainty and (i) with a fixed width, so nothing moves when the value
     changes. */
  .attr.ev-attr { align-items: flex-start; padding: 8px 0; }
  .attr.ev-attr dt { padding-top: 2px; }
  .attr.ev-attr dd { align-items: flex-start; min-height: 48px; }      /* the height of the 48 px edit icon: the row does not change height when the edit icons show or hide */
  .attr.ev-attr .attr-val { flex: 1; min-width: 0; }
  .ev-cell { display: block; width: 100%; }
  .ev-v { display: block; min-height: 24px; line-height: 24px; overflow-wrap: anywhere; }
  .ev-meter { display: flex; align-items: center; gap: 6px; height: 20px; }
  /* edit off: the percentage and the "i" end in the column of the icons of the rows below (see the note on .mi-ed above) */
  #more:not(.edit-on) .attr.ev-attr .ev-meter { padding-right: 14px; }
  .ev-bar { flex: 1; min-width: 0; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--secondary-text-color) 18%, transparent); overflow: hidden; }
  .ev-bar i { display: block; width: 0; height: 100%; border-radius: 2px; transition: width 0.4s ease; }
  .ev-bar.lvl-high i { background: var(--success-color); }
  .ev-bar.lvl-mid i { background: var(--warning-color); }
  .ev-bar.lvl-low i { background: var(--error-color); }
  .ev-pct { flex: none; width: 3.2em; text-align: right; font-size: 11px; font-variant-numeric: tabular-nums; color: var(--secondary-text-color); white-space: nowrap; }
  .ev-i { flex: none; width: 20px; height: 20px; padding: 0; margin: 0; border: 0; border-radius: 50%; background: transparent; color: var(--secondary-text-color); display: grid; place-items: center; cursor: pointer; }
  .ev-i:hover, .ev-i[aria-expanded="true"] { color: var(--primary-text-color); background: var(--ha-hover); }
  .ev-i .mdi { width: 14px; height: 14px; }
  .ev-pop {
    position: absolute; z-index: 20; padding: 10px 12px; border-radius: 10px; font-size: 13px; line-height: 1.45;
    background: var(--card-background-color); color: var(--primary-text-color); border: 1px solid var(--divider-color);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35); animation: pop-in 0.12s ease-out;
    overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; -webkit-overflow-scrolling: touch; box-sizing: border-box;
  }
  /* The pop-up of the (i): a header (the name of the row and the certainty as a small coloured pill), one line of "why" or the clues, and the rejected
     hypotheses. Name, small bar and points are in three aligned columns; every text is cut at 2-3 lines (the whole text is in the title), so the
     pop-up stays compact whatever the language or the longest sentence. */
  .ev-pop { font-size: 12.5px; line-height: 1.4; }
  .evp-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
  .evp-h b { font-size: 13px; font-weight: 500; }
  .evp-n { flex: none; padding: 0 8px; border-radius: 9px; font-size: 12px; font-weight: 500; line-height: 18px; font-variant-numeric: tabular-nums; color: var(--secondary-text-color); background: color-mix(in srgb, var(--secondary-text-color) 16%, transparent); }
  .evp-n.lvl-high { color: var(--success-text-color); background: color-mix(in srgb, var(--success-color) 16%, transparent); }
  .evp-n.lvl-mid { color: var(--warning-text-color); background: color-mix(in srgb, var(--warning-color) 16%, transparent); }
  .evp-n.lvl-low { color: var(--error-color); background: color-mix(in srgb, var(--error-color) 16%, transparent); }
  .evp-line { margin: 0 0 4px; color: var(--secondary-text-color); display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .evp-sec { margin: 8px 0 4px; font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--secondary-text-color); }
  .evp-rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .evp-row { display: grid; grid-template-columns: minmax(0, 1fr) 64px 32px; column-gap: 8px; align-items: center; }
  .evp-row.nopts { grid-template-columns: minmax(0, 1fr); }
  .evp-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .evp-bar { height: 4px; border-radius: 2px; overflow: hidden; background: color-mix(in srgb, var(--secondary-text-color) 18%, transparent); }
  .evp-bar i { display: block; height: 100%; border-radius: 2px; background: var(--primary-color); }
  .evp-pts { text-align: right; font-variant-numeric: tabular-nums; color: var(--secondary-text-color); }
  .evp-note { grid-column: 1 / -1; font-size: 11.5px; color: var(--secondary-text-color); display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  @media (prefers-reduced-motion: reduce) {
    .ev-bar i, .ev-pop { transition: none; animation: none; }
  }

  @media (max-width: 600px) {
    /* The buttons under the sheet shrink on a narrow screen so that they stay inside it: they share the width, the text is cut
       with "..." if needed. */
    #more .mi-actions { flex-wrap: nowrap; gap: 6px; padding-left: 12px; padding-right: 12px; }
    #more .mi-actions .btn { flex: 1 1 0; min-width: 0; padding: 2px 10px 0; gap: 6px; }
    #more .mi-actions .btn > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #more .mi-actions .mi-flag { flex: none; }
  }

  /* The text box of the flag ("What is wrong?"): tall enough from the start, the text starts under the label and never slides
     under it. */
  .field textarea {
    display: block; width: 100%; min-height: 168px; padding: 32px 16px 10px; box-sizing: border-box; border: 0; border-bottom: 1px solid var(--secondary-text-color);
    border-radius: 4px 4px 0 0; background: color-mix(in srgb, var(--secondary-text-color) 10%, transparent); color: var(--primary-text-color);
    font: inherit; font-size: 16px; line-height: 22px; outline: none; resize: vertical; transition: border-color 0.15s, background-color 0.15s;
  }

// The three functions that reach the internet and whether each is on: three boxes as in the latency tile, label on the left and On or Off on the right.

// One labelled bar of the "recognised devices" tile: count and label above, share shown by the bar.
function lensRow(n, total, labelKey, color) {

    '<div class="pbar"><i style="width:' + pct.toFixed(1) + '%"></i></div></div>';

function lensTile() {
  const devices = Array.from(S.devices.values());
  const total = devices.length;
  if (!total) return null;
  // A card missing from S.analysis is identified; "analysing" is the state under analysis, everything else not yet identified waits.
  let analysing = 0, waiting = 0;
  devices.forEach(function (d) {
    const info = S.analysis[d.id];
    if (!info) return;
    if (info.state === "analysing") analysing++; else waiting++;
  });
  // Devices whose deep search is running right now.
  const deepCount = devices.filter(function (d) { return deepOneBusy(d.id); }).length;
  const ok = total - analysing - waiting, pct = Math.round(ok / total * 100);
  return {
    id: "lens",
    tip: t("js.ha.tile.lens_tip", { ok: ok, total: total, pct: pct, wait: analysing + waiting }),
    html: cardHTML("var(--purple-color)", "magnify", esc(t("js.ha.tile.lens")),
      '<div class="t-bars">' +
        lensRow(ok, total, "js.ha.tile.identified", "var(--purple-color)") +

        lensRow(deepCount, total, "js.ha.deep.title", "var(--warning-color)") +

      "")

  const on = !!(S.mqtt && S.mqtt.active && S.mqtt.connected), configured = !!(S.mqtt && S.mqtt.active), last = cycles[cycles.length - 1];

function tiles() {
  const gw = gateway();
  refreshGatewayHistory(gw);
  const own = extra ? extra() : null, list = [latencyTile(gw), gatewayTile(gw), internetTile(), externalTile(), lensTile(), mqttTile()].filter(Boolean);
  return own ? list.concat([own]) : list;
}

// The new content replaces the old one with a short fade; a refresh of the same tile (new numbers) is written at once.
function put(body, tile, fade) {
  if (body._html === tile.html) return;
  const swap = fade && body._id !== tile.id && !REDUCED;
  body._id = tile.id;
  body._html = tile.html;
  if (!swap) { body.innerHTML = tile.html; return; }
  body.classList.add("out");
  setTimeout(function () {
    body.innerHTML = tile.html;
    body.classList.remove("out");
    body.classList.add("pre");
    void body.offsetWidth;
    body.classList.remove("pre");
  }, FADE_MS);
}
function paintTile(fade) {
  const el = $("rot");
  if (!el) return;
  const list = tiles(), row = el.parentElement;
  el.hidden = !list.length;
  row.classList.toggle("solo", !list.length);
  if (!list.length) return;
  const own = list[list.length - 1];
  if (own && own.attention !== undefined) {
    if (own.attention && own.attention !== seenAttention) { shown = list.length - 1; holdUntil = Date.now() + ATTENTION_HOLD_MS; fade = true; }
    seenAttention = own.attention;
  }
  const cur = current = list[shown % list.length], dots = el.querySelector(".t-dots");
  paintDots(dots, cur, own);
  el.title = cur.tip;
  el.setAttribute("aria-label", cur.tip + " · " + t("js.ha.tile.next"));
  put(el.querySelector(".t-body"), cur, fade);
}

// The two segments: the bar starts again at each new tile; the dot shows that the tile of the page asks for attention, in its colour.
function paintDots(dots, cur, own) {
  if (!dots.children.length) dots.innerHTML = '<i class="bar"></i><i class="dot"></i>';
  const bar = dots.children[0], dot = dots.children[1], alert = !!(own && own.attention);
  dot.classList.toggle("alert", alert);
  if (alert) dots.style.setProperty("--ac", own.color);
  if (dots._id === cur.id) return;
  dots._id = cur.id;
  dots.style.setProperty("--ms", ROTATE_MS + "ms");
  bar.classList.remove("run"); void bar.offsetWidth; bar.classList.add("run");
}
function advance() { shown++; paintTile(true); }
function onTileClick(e) { if (current && current.open && e.target.closest("[data-open]")) current.open($("rot")); else advance(); }
function tileHTMLShell() {
  return '<button type="button" class="nettile" id="rot" hidden><div class="t-body"></div><div class="t-dots"></div></button>';
}
function mountTile() {
  const el = $("rot");
  clearInterval(timer);
  hold = false;
  el.addEventListener("click", onTileClick);
  el.addEventListener("mouseenter", function () { hold = true; });
  el.addEventListener("mouseleave", function () { hold = false; });
  el.addEventListener("focus", function () { hold = true; });
  el.addEventListener("blur", function () { hold = false; });
  if (!REDUCED) timer = setInterval(function () { if (!hold && !document.hidden && Date.now() >= holdUntil) advance(); }, ROTATE_MS);
  paintTile(false);
}

// ------------------------------------------------------------ network health: made-up findings, debug mode only
// To see the screens without a real problem. Nothing is asked of the server or of any device: the answer of /api/ha/health is replaced, in this page, by one of these scenarios.
// The addresses are the ones kept for documentation (192.0.2.x), the names say they are made up. The choice is kept in this browser only.
const SIM_KEY = "vedetta-health-sim";
const SIM_SCENARIOS = ["off", "calm", "one", "all", "grave", "many"];

// The preview of the public demo (the page sets window.VEDETTA_PREVIEW = "health"): the feature is shown with all four kinds of finding and no way to change them, marked "coming soon".
function simPreview() { return window.VEDETTA_PREVIEW === "health"; }
function simScenario() {
  if (simPreview()) return "all";
  try { const v = localStorage.getItem(SIM_KEY); return SIM_SCENARIOS.indexOf(v) > 0 ? v : "off"; } catch (e) { return "off"; }
}
function simOn() { return simScenario() !== "off"; }
// The next scenario in the list, back to "off" after the last; returns it.
function simNext() {
  if (simPreview()) return "all";
  const next = SIM_SCENARIOS[(SIM_SCENARIOS.indexOf(simScenario()) + 1) % SIM_SCENARIOS.length];
  try { localStorage.setItem(SIM_KEY, next); } catch (e) { /* storage not available: the scenario lasts until the page is closed */ }
  return next;
}

function simDevs(n) {
  const list = [];
  for (let i = 0; i < n; i++) list.push({ name: "Simulated device " + (i + 1), ip: "192.0.2." + (20 + i) });
  return list;
}
function simFinding(rule, tile, lv, key, devs, ageSec, hits, data) {
  const now = Date.now() / 1000;
  return { id: "SIM-" + rule + ":" + key, rule: rule, tile: tile, lv: lv, devs: devs, since: now - ageSec, last: now - 60, hits: hits, shadow: true, data: data };
}
const SIM_FINDINGS = {
  addr: function () { return simFinding("H20", "addr", "warn", "addr", [{ name: "Simulated device 1", ip: "192.0.2.50" }, { name: null, ip: "192.0.2.50", mac: "02:00:5e:00:53:99" }], 1500, 3, { ips: 1, macs: 2 }); },
  drop: function (n) { return simFinding("H06", "drop", "warn", "lan", simDevs(n), 7200, 1, { devices: n, of: 20 }); },
  boot: function () { return simFinding("H05", "boot", "warn", "boot", simDevs(1), 10800, 30, { drops: 11, period_s: 600, cv: 0.1 }); },
  lat: function (lv) { return simFinding("H07", "lat", lv, "lat", simDevs(1), 3000, 6, { from_ms: 4, to_ms: 38 }); },
};
function simFindings(scenario) {
  if (scenario === "one") return [SIM_FINDINGS.boot()];
  if (scenario === "all") return [SIM_FINDINGS.addr(), SIM_FINDINGS.drop(6), SIM_FINDINGS.boot(), SIM_FINDINGS.lat("warn")];
  if (scenario === "grave") return [SIM_FINDINGS.lat("bad"), SIM_FINDINGS.drop(6)];
  if (scenario === "many") return [SIM_FINDINGS.drop(18)];
  return [];
}
// What /api/ha/health would answer in the chosen scenario (nothing hidden: the page keeps its own list while it simulates).
function simAnswer() {
  const now = Date.now() / 1000;
  return { running: true, findings: simFindings(simScenario()), report: { judged: now - 120, last_problem: { rule: "H20", end: now - 3 * 86400 } }, hidden: [] };
}

}

// Timeline strokes: online/offline segments plus the "no data" gaps,
// clipped to the window. No intermediate state.
function bucketsFor(win) {
  const segs = win.segments.slice().sort(function (x, y) { return x.from - y.from; });
  let out = [], cur = win.from;
  segs.forEach(function (s) {
    const a = Math.max(s.from, win.from), b = Math.min(s.to, win.to);
    if (b <= a) return;
    if (a > cur) out.push({ a: cur, b: a, st: "nodata" });
    out.push({ a: a, b: b, st: s.online ? "on" : "off" });
    cur = Math.max(cur, b);
  });
  if (cur < win.to) out.push({ a: cur, b: win.to, st: "nodata" });
  return out;
}

// Small line chart (SVG) of the response time: series already reduced by the
// server to ~120 points [ts, ms]. Empty if there is no data.
function latencyChart(lat) {
  const pts = lat && lat.points ? lat.points : [];
  if (pts.length < 2) return "";
  const W = 300, H = 56, pad = 3, span = Math.max(1, lat.to - lat.from);
  let max = 1;
  pts.forEach(function (p) { if (p[1] > max) max = p[1]; });
  const line = pts.map(function (p, i) {
    const x = (p[0] - lat.from) / span * W, y = H - pad - p[1] / max * (H - 2 * pad);
    return (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
  }).join(" ");
  const lastX = ((pts[pts.length - 1][0] - lat.from) / span * W).toFixed(1), firstX = ((pts[0][0] - lat.from) / span * W).toFixed(1);
  const area = line + " L" + lastX + " " + H + " L" + firstX + " " + H + " Z";
  return '<div class="lat-chart"><div class="lat-head"><span>' + esc(t("js.ha.more.latency_title")) + "</span><span>" +
    esc(t("js.ha.more.latency_stats", { avg: Math.round(lat.avg), max: Math.round(lat.max) })) + "</span></div>" +
    '<svg viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" role="img" aria-label="' + esc(t("js.ha.more.latency_aria")) + '">' +
    '<path class="lat-area" d="' + area + '"></path><path class="lat-line" d="' + line + '"></path></svg></div>';
}

function paintGraph(win, hours) {
  const el = $("mi-graph");
  if (!el) return;
  const latHtml = latencyChart(win.latency);
  if (!win.segments || !win.segments.length) {
    el.innerHTML = '<div class="graph-msg">' + icon("history") + "<span>" + esc(t("js.ha.more.nodata")) + "</span></div>" + latHtml;
    return;
  }
  const from = win.from, to = win.to, span = to - from, longRange = hours > 24;
  const outages = win.segments.filter(function (s) { return !s.online; }).length;
  const label = { on: t("js.ha.more.tip_online_seg"), off: t("js.ha.more.tip_offline_seg"), nodata: t("js.ha.more.nodata") };
  const strip = bucketsFor(win).map(function (b) {
    const left = (b.a - from) / span * 100, w = Math.max(0.4, (b.b - b.a) / span * 100);
    const tip = label[b.st] + "\n" + fmtStamp(b.a, longRange) + " – " + fmtStamp(b.b, longRange);
    return '<i class="' + b.st + '" style="left:' + left.toFixed(2) + "%;width:" + w.toFixed(2) + '%" data-tip="' + esc(tip) + '"></i>';
  }).join("");
  const ticks = [];
  if (!longRange) { for (var h = 0; h <= 24; h += 6) ticks.push(h === 24 ? t("js.ha.more.now") : fmtClock(from + h * 3600)); }
  else {
    for (var d = 0; d < 7; d++) ticks.push(new Date((from + d * 86400) * 1000).toLocaleDateString(LANG, { weekday: "short" }));
    ticks.push(t("js.ha.more.now"));
  }
  const pct = win.online_pct;
  el.innerHTML =
    '<div class="stats">' +
    '<div class="stat"><span class="stat-v">' + outages + '</span><span class="stat-l">' + esc(t("js.ha.more.outages", { n: outages })) + "</span></div></div>" +
    '<div class="chart" role="img" aria-label="' + esc(t("js.ha.more.chart_aria")) + '">' +
      '<div class="tl">' + strip + "</div>" +
      '<div class="axis">' + ticks.map(function (x) { return "<span>" + esc(x) + "</span>"; }).join("") + "</div>" +
      '<div class="tip" id="tip" hidden></div></div>' + latHtml;
}

function tipFor(e) {

function copyText(text) {
  function fallback() {
    // With a modal dialog open the rest of the page is "inert": the support
    // field must be inside the dialog, otherwise it cannot be selected and
    // the copy fails silently (happens on HTTP, where the clipboard API is missing).
    const host = document.querySelector("dialog[open]") || document.body;
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("aria-hidden", "true");
    ta.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px";
    host.appendChild(ta);
    ta.focus();
    ta.select();
    try { ta.setSelectionRange(0, text.length); } catch (err) { /* ignore */ }
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
    host.removeChild(ta);
    return ok;
  }
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return fallback(); });
  }
  return Promise.resolve(fallback());
}

// Opening an external page (the device's web interface, classic
// dashboard): a link with target="_blank" inside the iframe of the HA mobile app
// may be ignored. It is opened with window.open from a user gesture; if the
// browser blocks it, the address is copied and a notice is shown.
function openExternal(url) {
  let w = null;
  try { w = window.open(url, "_blank"); } catch (err) { w = null; }
  if (w) { try { w.opener = null; } catch (err) { /* ignore */ } return; }
  function copyFallback() {
    copyText(url).then(function (ok) {
      snack(t("js.ha.toast.open_blocked"), { kind: ok ? "success" : "error", ms: 4500 });
    });
  }
  // In the HA mobile app the iframe cannot open windows: the upper level
  // (the app) is asked to navigate, which opens an external address in the default
  // browser. If the page does not go to the background within a moment, it did not
  // succeed and the fallback is copying the address.
  const inApp = window.top !== window && /home\s?assistant/i.test(navigator.userAgent || "");
  if (!inApp) { copyFallback(); return; }
  let left = false;
  function onHide() { if (document.hidden) left = true; }
  document.addEventListener("visibilitychange", onHide);
  try { window.open(url, "_top"); } catch (err) { /* ignore */ }
  setTimeout(function () {
    document.removeEventListener("visibilitychange", onHide);
    if (!left) copyFallback();
  }, 900);
}
document.addEventListener("click", function (e) {
  const a = e.target.closest ? e.target.closest('a[target="_blank"]') : null;
  if (!a || e.defaultPrevented || e.ctrlKey || e.metaKey || e.shiftKey) return;
  e.preventDefault();
  openExternal(a.href);
});

  const y = new Date(n.getTime() - 86400000);
  if (key(d) === key(n)) return t("js.ha.day.today");
  if (key(d) === key(y)) return t("js.ha.day.yesterday");

}
var LOG_LEVELS = ["min", "normal", "detail"];

    else groups.push({ key: key, e: e, n: 1 });

  groups.forEach(function (g) {

    const msg = g.n > 1 ? t("js.ha.log.flap", { n: g.n, state: t(e.online ? "js.ha.state.online" : "js.ha.state.offline") }) : e.message;
    html += '<' + (e.known ? 'button type="button"' : 'div') + ' class="log-row' + (e.known ? " rp" : "") + fresh + '"' + (e.known ? ' data-id="' + esc(e.device_id) + '"' : "") + ">" +
      '<span class="log-ic ' + cls + '">' + icon(e.dev_icon && I.paths[e.dev_icon] ? e.dev_icon : typeIcon(e.type)) + "</span>" +
      '<span class="log-text"><span class="log-msg"><b>' + esc(name) + "</b> " + esc(msg) + '</span><span class="log-ago" data-ts="' + e.ts + '">' + esc(ago(e.ts)) + "</span></span>" +

      // Log level: next to the search, in a column with the title arrow

// A live state change extends/closes the last segment without requesting anything.
function histPush(id, online) {
  let h = S.hist.get(id), now = Math.floor(nowSec());

// ------------------------------------------------- deep search
// Advanced search: system, open services, web page. Slow. From the menu (all devices, or the ones never analysed) it starts
// as soon as the choice is made; on a single device the confirmation can be switched off. While one is running no other
// can start: the buttons are off until it is over (the network search is independent and stays available).

  if (busy && deepMenuEl && !deepMenuEl.hidden) toggleDeepMenu(false);
  if (typeof dlg !== "undefined" && dlg) {
    var sheetBtn = dlg.querySelector('[data-act="deep"]');

function runDeep(ids) {
  const fresh = ids.filter(function (id) { return !deepOneBusy(id); });
  if (!fresh.length) { if (ids.length) snack(t("js.ha.deep.already"), { kind: "warning" }); return; }      // never in silence
  fresh.forEach(function (id) { deepFlying.add(id); });

  }).catch(function () { snack(t("js.ha.toast.error"), { kind: "error" }); }).then(function () { fresh.forEach(function (id) { deepFlying.delete(id); }); S.dirty.net = true; schedule(); syncDeepBusy(); });

// The badge: how many devices were never analysed in depth. It is ONE element that changes place: on the corner of the arrow

function moveDeepBadge(toSlot) {
  const b = deepBadge, dest = toSlot ? deepMenuEl.querySelector(".dm-slot") : deepSplit();
  if (!dest) return;
  const first = b.getBoundingClientRect();           // where it is now (also when it is half way)
  if (deepFlight) { deepFlight.cancel(); deepFlight = null; }
  deepFlightId++;
  b.style.left = b.style.top = "";
  dest.appendChild(b);
  b.dataset.at = toSlot ? "slot" : "corner";
  if (b.hidden || REDUCED || !b.animate || !first.width) return;
  const last = b.getBoundingClientRect(), id = deepFlightId;
  document.body.appendChild(b);
  b.dataset.at = "fly";
  b.style.left = last.left + "px";
  b.style.top = last.top + "px";

var BRAND_COLORS = 8;

function renderBrands() {
  const el = $("brands");

    // Brand of the PRODUCT, never the network card manufacturer (an

  const rows = Object.keys(map).map(function (k) { return { name: k, n: map[k] }; });
  rows.sort(function (a, b) { return b.n - a.n || a.name.localeCompare(b.name); });

  if (sampleCycle()) paintTile(false);

function doRefresh() {
  if (S.refreshing) return;
  S.refreshing = true;
  S.refreshStart = Date.now();
  S.changedSince = 0;
  S.poll.nextAt = Date.now();
  updateScan();
  api("/api/refresh", { method: "POST" }).catch(function () {
    S.refreshing = false;
    updateScan();
    snack(t("js.ha.toast.refresh_failed"), { kind: "error" });
  });
  setTimeout(function () { if (S.refreshing) { S.refreshing = false; updateScan(); } }, 15000);
}
function refreshDone() {
  if (!S.refreshing) return;
  const wait = Math.max(0, 700 - (Date.now() - S.refreshStart));
  const changed = S.changedSince;
  setTimeout(function () {
    if (!S.refreshing) return;
    S.refreshing = false;
    updateScan();
    if (changed) snack(t("js.ha.toast.refresh_changes", { n: changed }), { kind: "success", ms: 3200 });
  }, wait);
}

function doScan() {
  if (S.scanBusy || S.activity.search) return;
  S.scanBusy = true;
  updateScan();
  api("/api/scan/quick", { method: "POST" }).then(function (list) {
    // An address appears only once in the acquisition list.
    const once = {};
    S.found = (Array.isArray(list) ? list : []).filter(function (h) {
      if (!h.ip || once[h.ip]) return false;
      once[h.ip] = true;
      return true;
    });
    const n = S.found.length;
    S.scanned = true;
    S.scanDone = true;
    S.dismissedNew = {};      // a search the user asks for shows again what the app had seen by itself
    try { localStorage.setItem("vedetta-ha-scanned", "1"); } catch (err) { /* ignore */ }
    renderNew();
    snack(n === 0 ? t("js.ha.toast.scan_none") : t("js.ha.toast.scan_found", { n: n }), { kind: "success" });
    // No scrolling: the card opens where it is, under the network card, and pushes the rest down (see renderNew).
  }).catch(function () {
    snack(t("js.ha.toast.scan_failed"), { kind: "error" });
  }).then(function () {
    S.scanBusy = false;
    updateScan();
  });
}


// ---------------------------------------------------------- update
// Changes accumulate and are applied once per frame.
function schedule() {
  if (S.flushQueued) return;
  S.flushQueued = true;
  requestAnimationFrame(flush);
}
function flush() {
  S.flushQueued = false;
  const dirty = S.dirty;
  if (!S.loaded) return;
  if (dirty.layout) { dirty.layout = false; layout(); dirty.ids.clear(); }
  else if (COMPACT && dirty.ids.size) { layout(); dirty.ids.clear(); }
  else { dirty.ids.forEach(updateTile); dirty.ids.clear(); }
  if (dirty.net) { dirty.net = false; updateNetwork(); updateScan(); }
  if (dirty.more) { dirty.more = false; updateMore(); }
}


// New devices detected on the network (card and notifications) are shown only when the
// card panel is already populated, and a few seconds later: first the dashboard, then
// the news. After a manual search they appear immediately (S.scanDone).
var NEW_DELAY_MS = 10000;
function armNew() {
  if (S.newReady || S.newTimer || !S.list.length) return;
  S.newTimer = setTimeout(function () {
    S.newReady = true;
    renderNew();
    S.dirty.net = true;
    schedule();
  }, NEW_DELAY_MS);
}
function onDevice(ev) {
  const d = prepare(ev.device), prev = S.devices.get(d.id);
  S.devices.set(d.id, d);
  if (S.refreshing) S.changedSince++;
  const structural = !prev || prev.type !== d.type || prev.icon !== d.icon || prev.name !== d.name || prev.ip !== d.ip || prev.is_mobile !== d.is_mobile || prev.scanned_at !== d.scanned_at || prev.deep_empty_at !== d.deep_empty_at;
  // New device or category, icon, name, IP changed: the internal list (from which the
  // groups are made) is rebuilt, otherwise the card stays in the old group.
  if (structural) rebuildList();
  if (prev && prev.online !== d.online) {
    flash(d.id, d.online ? "on" : "off");
    histPush(d.id, d.online);
    fetchLogSoon();
  }
  const f = S.filter;
  if (structural || prev.online !== d.online || f.status !== "all" || f.type || f.q || COMPACT) S.dirty.layout = true;
  S.dirty.ids.add(d.id);
  S.dirty.net = true;
  if (S.open === d.id) S.dirty.more = true;
  schedule();
  armNew();
}
function onRemoved(ev) {
  S.devices.delete(ev.id);
  S.tiles.delete(ev.id);
  S.hist.delete(ev.id);
  rebuildList();
  if (S.open === ev.id) closeMore();
  S.dirty.layout = true;
  S.dirty.net = true;
  schedule();
}
function onPoll(ev) {
  S.poll.known = true;
  S.poll.interval = ev.interval_ms || 30000;
  S.poll.nextAt = Date.now() + (ev.next_in_ms == null ? S.poll.interval : ev.next_in_ms);
  S.poll.paused = !!ev.paused;
  S.poll.pausedAt = ev.paused_in_ms == null ? null : Date.now() + ev.paused_in_ms;
  S.poll.pausedTotal = ev.paused_total_ms || null;
  refreshDone();
  updateScan();
}
function onActivity(ev) {
  const prev = S.activity.rescanning;
  S.activity.search = !!ev.search;
  S.activity.rescanning = new Set(ev.rescanning || []);
  prev.forEach(function (id) { S.dirty.ids.add(id); });
  S.activity.rescanning.forEach(function (id) { S.dirty.ids.add(id); });
  S.dirty.net = true;
  schedule();
}
function onNewDevices(ev) {
  const before = S.newDevices;
  const count = ev.count || 0;
  if ((S.scanDone || S.newReady) && before.init && count > before.count) {
    var known = {};
    before.devices.forEach(function (d) { known[d.mac] = true; });
    var fresh = (ev.devices || []).filter(function (d) { return !known[d.mac]; })[0] || {};
    snack(t("js.ha.new.toast", { label: fresh.hostname || fresh.brand || fresh.vendor || fresh.ip || "?" }), {
      kind: "warning", ms: 7000,
      action: { text: t("js.ha.toast.view"), fn: function () { if (newEl.scrollIntoView) newEl.scrollIntoView({ behavior: "smooth", block: "nearest" }); } }
    });
  }
  S.newDevices = { count: count, devices: ev.devices || [], init: true };
  renderNew();
  // A device that has just appeared: its card is open (renderNew) and is brought on screen.
  if (before.init && count > before.count && !newEl.hidden && newEl.scrollIntoView) newEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
  S.dirty.net = true;
  schedule();
}
// The state of each card (identified, settling, under analysis): the badge of the tile and the line of the open card follow it.
function onAnalysis(ev) {
  S.analysis = ev.cards || {};
  S.tiles.forEach(function (el, id) { updateTile(id); });
  if (S.open && dlg.open && S.mi.view === "main") { var od = S.devices.get(S.open); if (od) { miHero(od); miAttrs(od); } }
}
var ALERT_TOAST = { "alert.ip_conflict": true, "alert.dhcp_multiple": true };
function onAlert(ev) {
  if (S.log.open) fetchLogSoon();
  if (ev.message && ALERT_TOAST[ev.key]) snack(ev.message, { kind: "warning", ms: 7000 });
}

// ------------------------------------------------------- real-time stream
function connect() {
  clearTimeout(S.retryTimer);
  if (S.es) { S.es.close(); S.es = null; }
  const es = new EventSource("/api/ha/events?rev=" + S.rev + "&lang=" + encodeURIComponent(LANG));
  S.es = es;
  S.conn.last = Date.now();
  function on(name, fn) {
    es.addEventListener(name, function (e) {
      S.conn.last = Date.now();
      let ev;
      try { ev = JSON.parse(e.data); } catch (err) { return; }
      if (typeof ev.rev === "number" && ev.rev > S.rev) S.rev = ev.rev;
      fn(ev);
    });
  }
  on("device", onDevice);
  on("removed", onRemoved);
  on("poll", onPoll);
  on("activity", onActivity);
  on("alert", onAlert);
  on("new_devices", onNewDevices);
  on("analysis", onAnalysis);
  // The link with the MQTT broker (configured? connected?): the Home Assistant tile follows it as it changes, without waiting for a full reload.
  on("mqtt", function (ev) { S.mqtt = { active: !!ev.active, connected: !!ev.connected }; S.dirty.net = true; schedule(); });
  on("roles", function (ev) {
    // UPnP roles, names and types decide category, icon and name: if they change the groups are redone.
    function sig(r) { return JSON.stringify([r.by_ip || {}, r.names || {}, r.types || {}]); }
    const changed = sig(ev) !== sig(S.roles);
    S.roles = { by_ip: ev.by_ip || {}, via: ev.via || {}, names: ev.names || {}, types: ev.types || {}, dhcp: ev.dhcp || [], internet: ev.internet || null };
    S.tiles.forEach(function (el, id) { updateTile(id); });
    // The role also decides the category (e.g. gateway -> network equipment): the
    // devices are reloaded to redo the groups.
    if (changed && S.loaded) load({ silent: true });
    if (S.open && dlg.open && S.mi.view === "main") { var od = S.devices.get(S.open); if (od) miAttrs(od); }
  });
  es.onopen = function () {
    const wasDown = !S.conn.ok && S.conn.everOk;
    S.conn.retryAt = 3000;
    setConn(true);
    // After a drop (or a service restart, which resets the revisions) everything is
    // resynced: devices, categories, icons.
    if (wasDown) { if (S.loaded) load({ silent: true }); fetchLog(); fetchHist(); }
  };
  es.onerror = function () {
    // Reopens with the last seen revision: the server sends only the difference.
    es.close();
    if (S.es === es) S.es = null;
    setConn(false);
    S.retryTimer = setTimeout(connect, S.conn.retryAt);
    S.conn.retryAt = Math.min(15000, Math.round(S.conn.retryAt * 1.6));
  };
}

// ------------------------------------------------------------ startup
var loadTimer = null;
function load(opts) {
  opts = opts || {};
  clearTimeout(loadTimer);
  return Promise.all([api("/api/ha/summary"), api("/api/ha/devices")]).then(function (res) {
    const sum = res[0], dev = res[1];
    if (!dev.ready && S.loadTries < 8) {
      // The first check cycle has not finished yet: stay on the skeleton.
      S.loadTries++;
      loadTimer = setTimeout(load, 1500);
      return;
    }
    S.devices.clear();
    S.tiles.clear();
    (dev.devices || []).forEach(function (d) { S.devices.set(d.id, prepare(d)); });
    rebuildList();
    S.rev = dev.rev || 0;
    S.analysis = dev.analysis || {};
    if (sum.poll && sum.poll.interval_ms) {
      S.poll = { known: true, interval: sum.poll.interval_ms, nextAt: Date.now() + (sum.poll.next_in_ms || 0),
        paused: !!sum.poll.paused, pausedAt: sum.poll.paused_in_ms == null ? null : Date.now() + sum.poll.paused_in_ms,
        pausedTotal: sum.poll.paused_total_ms || null };
    }
    S.mqtt = sum.mqtt || null;
    S.external = sum.external || null;      // which of the functions that reach the internet are on (add-on options)
    S.version = sum.version || "";
    if (!S.starMenu) { S.starHint = !!sum.star_hint; setStarBadge(); }
    S.update = sum.update || null;
    setUpdateDot();
    S.activity.search = !!(sum.activity && sum.activity.search);
    S.activity.rescanning = new Set((sum.activity && sum.activity.rescanning) || []);
    if (sum.roles) S.roles = sum.roles;
    const nd = sum.new_devices || {};
    S.newDevices = { count: nd.count || 0, devices: nd.devices || [], init: false };
    S.loaded = true;
    netEl.hidden = false;
    if (!(opts.silent && networkBuilt())) buildNetwork();
    renderNew();
    layout();
    armNew();
    updateNetwork();
    updateScan();
    fetchLog();
    fetchHist();
    api("/api/settings").then(function (s) { if (s && s.miss_limit) S.missLimit = s.miss_limit; }).catch(function () {});
    S.loadFails = 0;
    connect();
  }).catch(function (err) {
    S.loadFails = (S.loadFails || 0) + 1;
    S.lastErr = err || null;
    const expired = !!err && (err.status === 401 || err.status === 403);
    // Silent resync (return to the app, roles): the dashboard stays as it is.
    if (opts.silent && S.loaded) {
      if (expired) reloadHost();
      return;
    }
    S.loaded = false;
    const skeleton = $("skeleton-tiles");
    if (skeleton) skeleton.remove();
    netEl.hidden = true;
    reconcile(groupsEl, [emptyState("error")]);
    if (expired) reloadHost();  // only once a minute: then the button remains
  });
}

// What needs refreshing as time passes ("seen 5 min ago", 24 h bars).
function tick() {
  if (!S.loaded) return;
  S.tiles.forEach(function (el, id) { updateTile(id); });
  document.querySelectorAll(".log-ago").forEach(function (el) { el.textContent = ago(parseFloat(el.dataset.ts)); });
  if (S.open && dlg.open && S.mi.view === "main") { var d = S.devices.get(S.open); if (d) { miHero(d); miAttrs(d); } }
  if (COMPACT) layout();
}

// Where the pause menu goes: a pure function (nothing here touches the page, so a test can feed it any measure).
// The menu is centred on the round button of the Network card and is as wide as the room inside the card allows, so that it does not go past the right edge of the card
// (the button is about 118 px from it: a menu of 300 px, centred, went out by 30 px). Never wider than the maximum or than the window, never narrower than the minimum
// (then it may go past the card), and always inside the window (then it is not centred any more: the window wins).
var PAUSE_MAX_W = 232, PAUSE_MIN_W = 184, PAUSE_EDGE = 8;

// button, card: {left, width} and {left, right} as the browser measures them; returns {left, width, originX} (originX: where the animation starts, from the left edge of the menu).
function pausePlacement(button, card, winWidth) {
  const centre = button.left + button.width / 2;
  const room = 2 * (Math.min(centre - card.left, card.right - centre) - PAUSE_EDGE);
  const width = Math.min(PAUSE_MAX_W, winWidth - 2 * PAUSE_EDGE, Math.max(PAUSE_MIN_W, room));
  const left = Math.max(PAUSE_EDGE, Math.min(Math.round(centre - width / 2), winWidth - width - PAUSE_EDGE));
  return { left: left, width: width, originX: Math.round(centre - left) };
}

// ----------------------------------------------------------------- guided typing
// Fields that ask for an address help the typing: in a MAC the colons appear by themselves (and the letters become capitals); in an IP address
// the right arrow at the end of the number writes the dot (192.16 -> .1 -> .12 = 192.16.1.12). The colon or the dot typed by hand always works.
// kind: "mac" or "ip"; any other kind (a name) is left alone. Usable by any field.
function guidedFormat(kind, raw) {
  if (kind === "mac") return raw.replace(/[^0-9a-fA-F]/g, "").toUpperCase().slice(0, 12).replace(/(..)(?=.)/g, "$1:");
  const v = raw.replace(/[^0-9.]/g, "").replace(/\.{2,}/g, "."), parts = v.split(".").slice(0, 4).map(function (x) { return x.slice(0, 3); });
  return parts.join(".").replace(/^\./, "");

  if (out === field.value) return;
  const keep = kind === "mac" ? /[0-9A-F]/ : /[0-9]/, count = before.replace(kind === "mac" ? /[^0-9a-fA-F]/g : /[^0-9]/g, "").length;
  field.value = out;
  let np = out.length;
  if (!atEnd) { var c = 0; np = 0; while (np < out.length && c < count) { if (keep.test(out[np])) c++; np++; } }
  field.setSelectionRange(np, np);
}

function guidedKey(e, field, kind) {
  if (kind !== "ip" || e.key !== "ArrowRight" || e.shiftKey || e.ctrlKey || e.altKey || e.metaKey) return false;
  const v = field.value;
  if (field.selectionStart !== v.length || field.selectionEnd !== v.length || !/[0-9]$/.test(v) || v.split(".").length >= 4) return false;
  e.preventDefault();

}
