# Vedetta for Home Assistant Container (Docker Engine on Linux). Full guide: DOCKER.md
#
#   1. Put this file in an empty folder, e.g. /opt/vedetta, and edit the three lines marked EDIT.
#   2. Optional, for the data of Home Assistant: save a long-lived access token in ha_token.txt next to this file
#      (Home Assistant > your profile > Security; a dedicated non-admin user is enough), owned by root and private:
#      sudo chown root:root ha_token.txt && sudo chmod 600 ha_token.txt
#   3. docker compose up -d   then   docker logs vedetta   shows the one-time code to choose the password at http://<host>:8765
#
# Why each line is here (DOCKER.md, "Security"): the host network is how a network scanner sees the LAN (ARP, mDNS, DHCP);
# every Linux capability is dropped except the two it needs; no privileged mode, no Docker socket.

services:
  vedetta:
    image: ghcr.io/sived80/vedetta:1.1.0          # a fixed version: update on purpose (DOCKER.md, "Update")
    container_name: vedetta
    restart: unless-stopped
    network_mode: host                            # ARP, ping, mDNS, SSDP and the DHCP listener need the LAN itself
    entrypoint: ["/docker-run.sh"]                # start Vedetta directly (no service manager needed in Docker)
    cap_drop: [ALL]
    cap_add:
      - NET_RAW                                   # ping, arp-scan and nmap
      - NET_BIND_SERVICE                          # the passive DHCP listener (UDP port 67)
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Rome                             # EDIT: your time zone
      VEDETTA_HA_URL: http://192.168.1.10:8123    # EDIT: the address of Home Assistant (remove the line to run without it)
      VEDETTA_FRAME_ANCESTORS: http://192.168.1.10:8123   # EDIT: the same address, to show Vedetta in a Home Assistant dashboard
      # VEDETTA_PORT: "8765"                      # the port of the page
      # VEDETTA_INTERNET_UPDATE_CHECK: "false"    # no question to GitHub about new versions
      # VEDETTA_TRUSTED_PROXIES: "127.0.0.1"      # a reverse proxy on another host: its address
      # VEDETTA_ALLOWED_HOSTS: "vedetta.example.org"   # a host name that is not an address, localhost or *.local/.lan/.home.arpa/.internal
    secrets:
      - ha_token
    volumes:
      - ./data:/data                              # the map of your network, settings, password hash: back it up, keep it private
    mem_limit: 768m
    pids_limit: 256
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -o /dev/null http://127.0.0.1:$${VEDETTA_PORT:-8765}/healthz"]
      interval: 60s
      timeout: 10s
      start_period: 180s
      retries: 3

secrets:
  ha_token:
    file: ./ha_token.txt                          # create it even if empty when you do not use Home Assistant
