<svg xmlns='http://www.w3.org/2000/svg' width='996' height='176' viewBox='0 0 996 176' role='img' aria-label='The way of a change: from the test written first to the release' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif'><title>The way of a change: from the test written first to the release</title><rect width='996' height='176' rx='12' fill='#1a1a19'/><text x='24' y='34' fill='#f0efec' font-size='18' text-anchor='start' font-weight='600'>The way of a change</text><rect x='24' y='64' width='120' height='64' rx='10' fill='#262624' stroke='#33332f'/><text x='84.0' y='92' fill='#f0efec' font-size='13' text-anchor='middle' font-weight='400'>Test written</text><text x='84.0' y='110' fill='#f0efec' font-size='13' text-anchor='middle' font-weight='400'>first</text><path d='M147,96 h10 m-5,-5 l5,5 l-5,5' fill='none' stroke='#c3c2b7' stroke-width='2'/><rect x='162' y='64' width='120' height='64' rx='10' fill='#262624' stroke='#33332f'/><text x='222.0' y='92' fill='#f0efec' font-size='13' text-anchor='middle' font-weight='400'>326 automatic</text><text x='222.0' y='110' fill='#f0efec' font-size='13' text-anchor='middle' font-weight='400'>tests</text><path d='M285,96 h10 m-5,-5 l5,5 l-5,5' fill='none' stroke='#c3c2b7' stroke-width='2'/><rect x='300' y='64' width='120' height='64' rx='10' fill='#262624' stroke='#33332f'/><text x='360.0' y='92' fill='#f0efec' font-size='13' text-anchor='middle' font-weight='400'>Real exports</text><text x='360.0' y='110' fill='#f0efec' font-size='13' text-anchor='middle' font-weight='400'>replayed</text><path d='M423,96 h10 m-5,-5 l5,5 l-5,5' fill='none' stroke='#c3c2b7' stroke-width='2'/><rect x='438' y='64' width='120' height='64' rx='10' fill='#262624' stroke='#33332f'/><text x='498.0' y='101' fill='#f0efec' font-size='13' text-anchor='middle' font-weight='400'>Virtual LAN</text><path d='M561,96 h10 m-5,-5 l5,5 l-5,5' fill='none' stroke='#c3c2b7' stroke-width='2'/><rect x='576' y='64' width='120' height='64' rx='10' fill='#262624' stroke='#33332f'/><text x='636.0' y='101' fill='#f0efec' font-size='13' text-anchor='middle' font-weight='400'>CI on Linux</text><path d='M699,96 h10 m-5,-5 l5,5 l-5,5' fill='none' stroke='#c3c2b7' stroke-width='2'/><rect x='714' y='64' width='120' height='64' rx='10' fill='#262624' stroke='#33332f'/><text x='774.0' y='92' fill='#f0efec' font-size='13' text-anchor='middle' font-weight='400'>Debug app</text><text x='774.0' y='110' fill='#f0efec' font-size='13' text-anchor='middle' font-weight='400'>at home</text><path d='M837,96 h10 m-5,-5 l5,5 l-5,5' fill='none' stroke='#c3c2b7' stroke-width='2'/><rect x='852' y='64' width='120' height='64' rx='10' fill='#262624' stroke='#3987e5'/><text x='912.0' y='101' fill='#f0efec' font-size='13' text-anchor='middle' font-weight='400'>Release</text><text x='24' y='160' fill='#c3c2b7' font-size='13' text-anchor='start' font-weight='400'>A step that fails sends the change back to the start.</text></svg>
