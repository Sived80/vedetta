name: Vedetta
version: "0.13.1"
slug: vedetta
image: ghcr.io/sived80/{arch}-vedetta
description: "Local network dashboard: finds and recognizes the devices on your network, shows them in Home Assistant and shares what you choose"
url: https://github.com/Sived80/vedetta
arch:
  - amd64
  - aarch64
startup: application
boot: auto
# No watchdog address: the port is chosen by the Supervisor (ingress_port 0), so run.sh asks /healthz itself and stops the app if it hangs.
init: false
# Read-only access to the Home Assistant registries, for the name, brand, model and area of devices.
homeassistant_api: true
# The host network is needed for arp-scan, nmap, ping, SSDP/mDNS and the passive DHCP listener (UDP 67).
host_network: true
privileged:
  - NET_ADMIN
  - NET_RAW
# Web interface through ingress only (Home Assistant sidebar). With host_network the port is on the host, where another app
# may already use it (Discussion #20: 8765 was taken): 0 lets the Supervisor pick a free one, run.sh reads it.
ingress: true
ingress_port: 0
ingress_entry: ha
ingress_stream: true
panel_icon: mdi:radar
panel_title: Vedetta
services:
  - mqtt:want
options:
  log_level: info
  internet_public_ip: true
  internet_path: true
  internet_mac_database: true
  night_hour: 3
schema:
  log_level: list(debug|info|warning|error)
  interface: str?
  internet_public_ip: bool
  internet_path: bool
  internet_path_target: str?
  internet_mac_database: bool
  night_hour: int(0,23)?
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
