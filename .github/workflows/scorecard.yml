name: Scorecard

# OpenSSF Scorecard: an outside, automatic check of how the project is kept (protected branches, signed releases, tests,
# pinned dependencies, token permissions...). The score is published on scorecard.dev and shown by the badge of the README.
# It runs on main only: the published score must describe what users install.

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e    # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9    # v7.0.2
        with:
          name: scorecard
          path: results.sarif
          retention-days: 5
