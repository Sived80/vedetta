<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Vedetta - know every device on your network">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="0.55" stop-color="#0f1c33"/>
      <stop offset="1" stop-color="#0b2b45"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#03a9f4" stop-opacity="0"/>
      <stop offset="1" stop-color="#03a9f4" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#03a9f4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#03a9f4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7fd4ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <circle cx="930" cy="160" r="190" fill="url(#glow)"/>

  <!-- radar rings -->
  <g fill="none" stroke="#2a4a73" stroke-width="1.5" opacity="0.9">
    <circle cx="930" cy="160" r="40"/>
    <circle cx="930" cy="160" r="80"/>
    <circle cx="930" cy="160" r="120"/>
    <circle cx="930" cy="160" r="155" stroke="#35618f"/>
    <path d="M775 160H1085M930 5V315" stroke-dasharray="3 7" opacity="0.7"/>
  </g>

  <!-- rotating sweep -->
  <g transform="translate(930 160)">
    <g>
      <path d="M0 0 L155 0 A155 155 0 0 0 134 -78 Z" fill="url(#sweep)"/>
      <line x1="0" y1="0" x2="155" y2="0" stroke="#7fd4ff" stroke-width="2" opacity="0.9"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- devices found -->
  <g>
    <circle cx="1000" cy="105" r="6" fill="#43a047"><animate attributeName="r" values="5;8;5" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="865" cy="92" r="6" fill="#ffa600"><animate attributeName="r" values="5;8;5" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="190" r="6" fill="#03a9f4"><animate attributeName="r" values="5;8;5" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="905" cy="235" r="6" fill="#ec407a"><animate attributeName="r" values="5;8;5" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="170" r="6" fill="#ab47bc"><animate attributeName="r" values="5;8;5" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="955" cy="68" r="6" fill="#26c6da"><animate attributeName="r" values="5;8;5" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="160" r="9" fill="#03a9f4"/>
    <circle cx="930" cy="160" r="3.5" fill="#fff"/>
  </g>

  <!-- text -->
  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="70" y="150" font-size="96" font-weight="800" fill="url(#title)" letter-spacing="-2">Vedetta</text>
    <text x="74" y="196" font-size="27" fill="#a9c7e8">Know every device on your network.</text>
    <text x="74" y="236" font-size="18" fill="#6f93b8" letter-spacing="0.4">A Home Assistant app that finds, recognizes and explains.</text>
    <g font-size="14" font-weight="600" fill="#0a1020">
      <rect x="74" y="258" width="118" height="28" rx="14" fill="#03a9f4"/><text x="95" y="277">LOCAL ONLY</text>
      <rect x="204" y="258" width="150" height="28" rx="14" fill="#43a047"/><text x="222" y="277">READ-ONLY HA</text>
      <rect x="366" y="258" width="132" height="28" rx="14" fill="#ffa600"/><text x="383" y="277">EXPLAINABLE</text>
    </g>
  </g>
</svg>
