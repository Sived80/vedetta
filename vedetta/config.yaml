name: Vedetta
version: "0.6.2"
slug: vedetta
description: "Local network dashboard: finds and recognizes the devices on your network, shows them in Home Assistant and shares what you choose"
url: https://github.com/Sived80/vedetta
arch:
  - amd64
  - aarch64
startup: application
boot: auto
# The Supervisor checks this address and restarts the app if it does not answer.
watchdog: http://[HOST]:[PORT:8765]/healthz
init: false
# Read-only access to the Home Assistant registries, for the name, brand, model and area of devices.
homeassistant_api: true
# The host network is needed for arp-scan, nmap, ping, SSDP/mDNS and the passive DHCP listener (UDP 67).
host_network: true
privileged:
  - NET_ADMIN
  - NET_RAW
# Web interface through ingress only (Home Assistant sidebar). With host_network the
# port is on the host: 8765 was free on the tested installation.
ingress: true
ingress_port: 8765
ingress_entry: ha
ingress_stream: true
panel_icon: mdi:radar
panel_title: Vedetta
services:
  - mqtt:want
options:
  language: auto
  log_level: info
schema:
  language: list(auto|en|it|cs)
  log_level: list(debug|info|warning|error)
  star_hint: bool?
  interface: str?
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
