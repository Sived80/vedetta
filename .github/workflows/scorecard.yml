name: Scorecard

# OpenSSF Scorecard: an outside, automatic check of how the project is kept (protected branches, signed releases, tests,
# pinned dependencies, token permissions...). The score is published on scorecard.dev and shown by the badge of the README.
# It runs on main only: the published score must describe what users install.

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@v4
        with:
          name: scorecard
          path: results.sarif
          retention-days: 5
