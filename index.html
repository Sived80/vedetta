  var DEEP_MS = 2800;                                                 // how long the rings of the deep search turn
  var SCAN_MS = 1600;                                               // how long the "analysing" ring turns when "Add" is pressed

  // the times of the data are those of the build: they move to the moment of the opening, so "seen 45 min ago" is true whenever the page is opened
  var delta = Math.round(Date.now() / 1000 - D.now);
  (function shift(o) {
    if (!o || typeof o !== "object") return;
    Object.keys(o).forEach(function (k) {

      else shift(v);

  function history(hours) {                                          // every device, one window each (the page asks for all of them at once)
    var key = String(hours || 24), devs = {};
    Object.keys(D.hist).forEach(function (id) {
      var w = D.hist[id][key] || D.hist[id]["24"];
      devs[id] = { from: w.from, to: w.to, segments: w.segments, online_pct: w.online_pct };
    });
    return { hours: +key, devices: devs };
  }

  var sources = [], rev = 1;
  function emit(name, data) {                                         // an event of the stream, as the server would send it
    data.rev = data.rev || rev;
    sources.forEach(function (s) { (s.handlers[name] || []).forEach(function (fn) { fn({ data: JSON.stringify(data) }); }); });
  }

    s.handlers = {};
    sources.push(s);

    this.close = function () { sources = sources.filter(function (x) { return x !== s; }); };
  };

  // the language: the page is built with the tables of all the languages of the demo (window.__ALL_I18N); the one in the address (?lang=), or the last choice of the visitor, or English, is put in place BEFORE the app starts
  // (the build puts the call of __demoLang() where the page sets its own language). "Auto" is when nobody chose.
  var ALL = window.__ALL_I18N || {};
  window.__demoLang = function () {

    try { asked = new URLSearchParams(location.search).get("lang"); } catch (e) {}

    var lang = asked || saved || "en";

    window.VEDETTA_LANG = lang;
    window.VEDETTA_LANG_AUTO = !(asked && ALL[asked]) && !(saved && ALL[saved]);
    window.VEDETTA_I18N = ALL[lang] || ALL.en || {};

    else if (u.indexOf("/api/ha/logbook") === 0) b = D.logbook;

  var o = (location.hash || "").slice(1).split(","), t = o[0];

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 9 5 15 M12 9 19 15' stroke='%2303a9f4' stroke-width='2' fill='none'/%3E%3Ccircle cx='12' cy='6' r='3.2' fill='%2303a9f4'/%3E%3Ccircle cx='5' cy='18' r='3.2' fill='%2303a9f4'/%3E%3Ccircle cx='19' cy='18' r='3.2' fill='%2303a9f4'/%3E%3C/svg%3E">
  <style>/* Vedetta styled like Home Assistant (/ha). Variables use the same NAMES as the HA frontend, so the page in an
   iframe looks like part of the dashboard. Everything is in @layer: the layer order declared below decides precedence,
   not specificity. The feature files (20-80) follow in name order; within one layer, a later file wins on equal specificity.
   This file: reset, tokens, base, layout, shared components (card, buttons, search, menu, banner, skeletons, snackbar),
   the frame shared by every dialog (.more-info/.mi*), the .pill shared by menus and port pills, motion and shared keyframes. */
@layer reset, tokens, base, layout, components, dialog, motion;

/* ------------------------------------------------------------------- reset */
@layer reset {
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  /* No scroll bar is drawn anywhere (a bar at the side of a card looks dated): everything still scrolls with the wheel, the touch and the keys. */
  * { scrollbar-width: none; }
  *::-webkit-scrollbar { display: none; }
  body, h1, h2, h3, p, ul, dl, dd { margin: 0; }
  ul { padding: 0; list-style: none; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }
  /* Beats any component display: [hidden] elements are never shown. */
  [hidden] { display: none !important; }
}

/* ------------------------------------------------------------------ tokens */
@layer tokens {
  :root {
    color-scheme: light;
    --primary-color: #009ac7;              /* the primary blue of Home Assistant (--ha-color-primary-40) */
    --dark-primary-color: #0288d1;
    --light-primary-color: #b3e5fc;
    --accent-color: #ff9800;
    --primary-background-color: #fafafa;
    --secondary-background-color: #e5e5e5;
    --card-background-color: #ffffff;
    --primary-text-color: #212121;
    --secondary-text-color: #727272;
    --disabled-text-color: #bdbdbd;
    --text-primary-color: #ffffff;
    --divider-color: rgba(0, 0, 0, 0.12);
    --state-icon-color: #44739e;
    --success-color: #43a047;
    --warning-color: #ffa600;
    --error-color: #db4437;
    --info-color: #039be5;
    --ha-card-border-radius: 12px;
    --ha-card-border-width: 1px;
    --ha-card-box-shadow: none;
    --ha-hover: rgba(0, 0, 0, 0.05);
    --ha-scrim: rgba(0, 0, 0, 0.4);
    --ha-snack-bg: #323232;
    --ha-snack-fg: #ffffff;
    --ha-c1: var(--primary-color);
    --ha-c2: var(--accent-color);
    --ha-c3: #66bb6a;
    --ha-c4: #926bc7;
    --ha-c5: #e91e63;
    --ha-font: Roboto, Noto, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    /* The scale of Home Assistant (same names and values as its frontend; the iframe does not receive them from the host, so they are set here once).
       Font sizes and weights, corner radii, and the named colours (the same in every theme). */
    --ha-font-size-xs: 10px; --ha-font-size-s: 12px; --ha-font-size-m: 14px; --ha-font-size-l: 16px; --ha-font-size-xl: 20px;
    --ha-font-weight-normal: 400; --ha-font-weight-medium: 500; --ha-font-weight-bold: 700;
    --ha-border-radius-sm: 4px; --ha-border-radius-md: 8px; --ha-border-radius-lg: 12px; --ha-border-radius-xl: 16px; --ha-border-radius-pill: 9999px;
    --light-blue-color: #03a9f4; --orange-color: #ff9800; --green-color: #4caf50; --purple-color: #926bc7;
    --pink-color: #e91e63; --teal-color: #009688; --amber-color: #ffc107; --indigo-color: #3f51b5;
    /* Focus ring and readable text versions of the status colors (used by many feature files). */
    --focus-color: #0277bd;
    --success-text-color: #2e7d32;
    --warning-text-color: #b26a00;
    --error-text-color: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --primary-background-color: #111111;
      --secondary-background-color: #202020;
      --card-background-color: #1c1c1c;
      --primary-text-color: #e1e1e1;
      --secondary-text-color: #9b9b9b;
      --disabled-text-color: #8a8a8a;
      --divider-color: rgba(225, 225, 225, 0.12);
      --state-icon-color: #9e9e9e;
      --success-color: #66bb6a;
      --error-color: #ef5350;
      --ha-hover: rgba(255, 255, 255, 0.07);
      --ha-snack-bg: #e1e1e1;
      --ha-snack-fg: #1c1c1c;
      --focus-color: var(--primary-color);
      --success-text-color: var(--success-color);
      --warning-text-color: var(--warning-color);
      --error-text-color: var(--error-color);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --primary-background-color: #111111;
    --secondary-background-color: #202020;
    --card-background-color: #1c1c1c;
    --primary-text-color: #e1e1e1;
    --secondary-text-color: #9b9b9b;
    --disabled-text-color: #8a8a8a;
    --divider-color: rgba(225, 225, 225, 0.12);
    --state-icon-color: #9e9e9e;
    --success-color: #66bb6a;
    --error-color: #ef5350;
    --ha-hover: rgba(255, 255, 255, 0.07);
    --ha-snack-bg: #e1e1e1;
    --ha-snack-fg: #1c1c1c;
    --focus-color: var(--primary-color);
    --success-text-color: var(--success-color);
    --warning-text-color: var(--warning-color);
    --error-text-color: var(--error-color);
  }
}

/* -------------------------------------------------------------------- base */
@layer base {
  html, body { min-height: 100%; }
  body {
    background: var(--primary-background-color);
    color: var(--primary-text-color);
    font-family: var(--ha-font);
    font-size: 14px;
    line-height: 20px;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  /* ?bg=transparent: the iframe blends with the dashboard background. */
  html[data-bg="transparent"], html[data-bg="transparent"] body { background: transparent; }
  :focus-visible { outline: 2px solid var(--primary-color); outline-offset: 2px; }
  .mdi { width: 24px; height: 24px; fill: currentColor; display: block; flex: none; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
  .ha-root { max-width: 1600px; margin: 0 auto; padding: 16px; }
}

/* ------------------------------------------------------------------ layout */
@layer layout {
  .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .view { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 16px; align-items: start; overflow-anchor: none; }   /* a card that opens moves what is under it; the page does not scroll to compensate */
  .col-side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .col-main { min-width: 0; }
  /* #card-network: its position (sticky in the side column, in the flow when the cards are stacked) is in the overrides layer of 40-network.css:
     .ha-card (components) sets position: relative and would win over a rule written here. */
  .col-side { align-self: stretch; }
  /* Narrow layout: network, log (attached under it, as in the wide layout), devices. Inside Home Assistant the JS follows the host (html.is-narrow, set when the
     top bar of Home Assistant appears, and data-narrow-host says the host decides). The media query only serves the page before the
     host answers, outside Home Assistant and without JS. */
  html.is-narrow .view { grid-template-columns: minmax(0, 1fr); }
  html.is-narrow .col-side { display: contents; align-self: auto; }
  html.is-narrow #card-network { order: 1; }
  html.is-narrow .col-main { order: 3; margin-top: 8px; }      /* the gap of the grid (16) + 8: the first heading is 24 px under the card above, as the groups are among themselves */
  html.is-narrow #card-log { order: 2; }
  @media (max-width: 870px) {
    html:not([data-narrow-host]) .view { grid-template-columns: minmax(0, 1fr); }
    html:not([data-narrow-host]) .col-side { display: contents; align-self: auto; }
    html:not([data-narrow-host]) #card-network { order: 1; }
    html:not([data-narrow-host]) .col-main { order: 3; margin-top: 8px; }
    html:not([data-narrow-host]) #card-log { order: 2; }
  }
  @media (max-width: 520px) {
    .ha-root { padding: 8px; }
  }

  /* Compact mode (?compact=1): only the network card and a short list. */
  html[data-compact] .ha-root { padding: 8px; }
  html[data-compact] .toolbar { display: none; }
  html[data-compact] .view { grid-template-columns: minmax(0, 1fr); }
  html[data-compact] .col-side { display: contents; }
}

/* -------------------------------------------------------------- components */
@layer components {
  /* Ripple on touch */
  .rp { position: relative; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  .wave {
    position: absolute; border-radius: 50%; background: currentColor; opacity: 0.16;
    transform: scale(0); animation: ripple 0.6s ease-out forwards; pointer-events: none;
  }

  /* ha-card */
  .ha-card {
    position: relative; overflow: hidden;
    background: var(--card-background-color); color: var(--primary-text-color);
    border: var(--ha-card-border-width) solid var(--divider-color);
    border-radius: var(--ha-card-border-radius);
    box-shadow: var(--ha-card-box-shadow);
  }
  /* Header padding and gap, title sizes, .ch-ic size: overrides layer (Home Assistant values). */
  .card-header { display: flex; align-items: center; }
  .ch-text { flex: 1; min-width: 0; }
  .ch-title { font-weight: 500; display: flex; align-items: center; }
  .ch-sub { font-size: 14px; color: var(--secondary-text-color); }
  .ch-ic {
    border-radius: 50%; display: grid; place-items: center; margin-right: 8px;
    color: var(--secondary-text-color); background: color-mix(in srgb, var(--secondary-text-color) 14%, transparent);
  }
  .ch-ic.warn { color: var(--warning-color); background: color-mix(in srgb, var(--warning-color) 20%, transparent); order: -1; margin: 0 4px 0 0; }
  .card-content { padding: 0 16px 16px; }
  .card-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 8px; border-top: 1px solid var(--divider-color); }

  /* Buttons */
  .icon-btn {
    width: 48px; height: 48px; padding: 0; border: 0; border-radius: 50%; background: transparent;
    color: var(--secondary-text-color); display: inline-grid; place-items: center; flex: none;
    transition: background-color 0.15s, color 0.15s;
  }
  .icon-btn:hover { background: var(--ha-hover); color: var(--primary-text-color); }
  .icon-btn.spinning { color: var(--primary-color); }
  .btn {
    /* ONE size for every button (the one of "Search the network", the filters and the badges): 34 px, 12.5 px, weight 500, pill. The text is
       lowered by 1 px (2 px of padding on top): with line-height 1 the letters sit about 1 px above the middle; the icon is lifted back (below). */
    display: inline-flex; align-items: center; justify-content: center; gap: 5px; box-sizing: border-box;
    min-height: 34px; padding: 2px 14px 0; border: 1px solid transparent; border-radius: 17px;
    background: transparent; color: var(--primary-color); font-size: 12.5px; font-weight: 500; line-height: 1;
    text-decoration: none; letter-spacing: 0.0178em; transition: background-color 0.15s, opacity 0.15s, box-shadow 0.15s;
  }
  .btn .mdi { width: 18px; height: 18px; position: relative; top: -1px; }
  .btn:hover { background: color-mix(in srgb, var(--primary-color) 10%, transparent); }
  .btn.filled { background: var(--primary-color); color: var(--text-primary-color); }
  .btn.filled:hover { background: var(--dark-primary-color); }
  .btn.tonal { background: color-mix(in srgb, var(--primary-color) 16%, transparent); }
  .btn.outlined { border-color: var(--divider-color); }
  .btn.danger { color: var(--error-color); }
  .btn.danger:hover { background: color-mix(in srgb, var(--error-color) 10%, transparent); }
  .btn.filled.danger { background: var(--error-color); color: #fff; }
  .btn:disabled { opacity: 0.5; pointer-events: none; }
  .btn.busy { opacity: 0.6; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn-row.center { justify-content: center; margin-top: 16px; }

  /* Search field (network card search and log search) */
  .search {
    flex: 1; min-width: 0; height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 4px 0 16px; border-radius: 24px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .search:focus-within { border-color: var(--primary-color); box-shadow: 0 0 0 1px var(--primary-color); }
  .search-icon { color: var(--secondary-text-color); display: flex; }
  .search input {
    flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; outline: none;
    font-size: 16px; color: var(--primary-text-color);
  }
  .search input::placeholder { color: var(--secondary-text-color); }
  .search input::-webkit-search-cancel-button { display: none; }

  /* Menus */
  .menu-wrap { position: relative; }
  .menu {
    right: 0; top: calc(100% + 4px); z-index: 30;
    background: var(--card-background-color); border: 1px solid var(--divider-color); border-radius: 8px;
    box-shadow: 0 5px 5px -3px rgba(0, 0, 0, 0.2), 0 8px 10px 1px rgba(0, 0, 0, 0.14), 0 3px 14px 2px rgba(0, 0, 0, 0.12);
    animation: pop-in 0.14s ease-out; transform-origin: top right;
  }
  .menu-label { font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--secondary-text-color); }
  .menu-sep { height: 1px; background: var(--divider-color); margin: 8px 0; }
  .menu-item {
    display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 0 16px; border: 0;
    background: transparent; text-align: left; text-decoration: none; color: var(--primary-text-color); font-size: 14px;
  }
  .menu-item:hover { background: var(--ha-hover); }
  .menu-item[aria-checked="true"] { color: var(--primary-color); }
  .menu-item:disabled { opacity: 0.5; cursor: default; pointer-events: none; }
  .mi-check { width: 24px; height: 24px; display: grid; place-items: center; flex: none; }

  /* Connection banner */
  .banner {
    display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding: 8px 8px 8px 16px;
    background: color-mix(in srgb, var(--warning-color) 16%, var(--card-background-color));
    border: 1px solid color-mix(in srgb, var(--warning-color) 45%, transparent); border-radius: var(--ha-card-border-radius);
    animation: slide-down 0.25s ease-out;
  }
  .banner .mdi { color: var(--warning-color); }
  .banner-text { flex: 1; }

  /* Loading skeletons */
  .skeleton {
    border-radius: 8px;
    background: linear-gradient(90deg, rgba(128, 128, 128, 0.12) 25%, rgba(128, 128, 128, 0.22) 37%, rgba(128, 128, 128, 0.12) 63%);
    background-size: 400% 100%; animation: shimmer 1.4s ease infinite;
  }
  .skel-network { padding: 20px 16px 24px; }
  .sk-title { height: 28px; width: 40%; }
  .skel-row { display: flex; align-items: center; gap: 16px; margin-top: 20px; }
  .skel-col { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .sk-ring { width: 132px; height: 132px; border-radius: 50%; flex: none; }
  .sk-line { height: 14px; }
  .sk-line.short { width: 60%; }
  .sk-pill { height: 36px; width: 96px; border-radius: 18px; }
  .sk-heading { height: 20px; width: 160px; margin-bottom: 12px; }
  .sk-tile { height: 104px; border-radius: var(--ha-card-border-radius); }
  .sk-graph { height: 140px; }

  /* Snackbar */
  .snack-stack {
    position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); top: auto; right: auto;
    width: min(560px, calc(100vw - 32px)); margin: 0; padding: 0; border: 0; background: transparent; overflow: visible;
    transform: translateX(-50%); z-index: 100; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .snack {
    pointer-events: auto; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 6px 8px 6px 16px;
    background: var(--ha-snack-bg); color: var(--ha-snack-fg); border-radius: 4px; font-size: 14px;
    box-shadow: 0 3px 5px -1px rgba(0, 0, 0, 0.2), 0 6px 10px 0 rgba(0, 0, 0, 0.14), 0 1px 18px 0 rgba(0, 0, 0, 0.12);
    opacity: 0; transform: translateY(12px); transition: opacity 0.2s, transform 0.25s cubic-bezier(0.2, 0, 0, 1);
  }
  .snack.show { opacity: 1; transform: none; }
  .snack-text { flex: 1; }
  .snack-icon { display: flex; }
  .snack.error .snack-icon { color: var(--error-color); }
  .snack.warning .snack-icon { color: var(--warning-color); }
  .snack-action {
    min-height: 40px; padding: 0 12px; border: 0; border-radius: 20px; background: transparent;
    color: var(--primary-color); font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; font-size: 13px;
  }
  .snack-action:hover { background: color-mix(in srgb, var(--primary-color) 14%, transparent); }

  /* Buttons keep the same 34 px on touch screens too (decision 18/10: one size everywhere). */
}

/* ------------ dialog frame (shared by #more, #flows, #ignored, #exportdlg) */
@layer dialog {
  .more-info {
    padding: 0; border: 0; color: var(--primary-text-color); background: var(--card-background-color);
    border-radius: 28px; width: min(580px, calc(100vw - 32px)); max-width: none; max-height: min(780px, calc(100vh - 48px));
    margin: auto; overflow: hidden;
    box-shadow: 0 11px 15px -7px rgba(0, 0, 0, 0.2), 0 24px 38px 3px rgba(0, 0, 0, 0.14), 0 9px 46px 8px rgba(0, 0, 0, 0.12);
    font-family: var(--ha-font);
  }
  .more-info[open] { display: flex; flex-direction: column; animation: dialog-in 0.24s cubic-bezier(0.2, 0, 0, 1); }
  .more-info::backdrop { background: var(--ha-scrim); animation: fade-in 0.2s ease-out; }
  .mi { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .mi-header { display: flex; align-items: center; gap: 4px; padding: 8px 16px 0 8px; }
  .mi-titles { flex: 1; min-width: 0; }
  .mi-title { font-size: 22px; line-height: 28px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mi-sub { font-size: 14px; color: var(--secondary-text-color); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mi-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 24px 8px; }
  .mi-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 12px 16px 16px; border-top: 1px solid var(--divider-color); }

  /* Pill: the port pills and also the menu pills (menu-item pill); the menu restyles them in the overrides layer (.menu .pill) */
  .pill {
    --pc: var(--secondary-text-color);
    padding: 2px 10px; border-radius: 12px; font-size: 12px; line-height: 18px; color: var(--pc);
    background: color-mix(in srgb, var(--pc) 14%, transparent); border: 1px solid color-mix(in srgb, var(--pc) 32%, transparent);
  }

  @media (max-width: 600px) {
    /* Narrow screens: full-screen dialog */
    .more-info { width: 100vw; max-width: 100vw; height: 100%; max-height: 100%; border-radius: 0; margin: 0; }
    .mi-body { padding: 0 16px 8px; }
  }
}

/* ------------------------------------------------------------------ motion */
@layer motion {
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
  @keyframes ripple { to { transform: scale(1); opacity: 0; } }
  @keyframes tile-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes pop-in { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: none; } }
  @keyframes slide-down { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  @keyframes dialog-in { from { opacity: 0; transform: translateY(16px) scale(0.97); } to { opacity: 1; transform: none; } }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pulse { 50% { opacity: 0.45; } }
  @keyframes bump { 30% { transform: scale(1.08); } 100% { transform: none; } }
  @keyframes ping { 0% { transform: scale(1); opacity: 0.55; } 100% { transform: scale(1.8); opacity: 0; } }
  @keyframes item-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  @keyframes lens-bob { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-1.5px, -1.5px); } }
  @keyframes deep-blink {
    0%, 100% { opacity: 0.28; stroke-width: 3; filter: drop-shadow(0 0 0 rgba(3, 169, 244, 0)); }
    50% { opacity: 1; stroke-width: 5; filter: drop-shadow(0 0 5px rgba(3, 169, 244, 0.9)); }
  }
  @keyframes indeterminate { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
  @keyframes live-pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--success-color) 55%, transparent); }
    70%, 100% { box-shadow: 0 0 0 7px transparent; }
  }
  @keyframes flash-on {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--success-color) 60%, transparent); }
    100% { box-shadow: 0 0 0 14px transparent; }
  }
  @keyframes flash-off {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--error-color) 60%, transparent); }
    100% { box-shadow: 0 0 0 14px transparent; }
  }

/* -------------------------- overrides (later corrections, strongest layer) */
@layer overrides {
  /* Dialog header: the right padding matches the right edge of the More info rows (24 px, 16 px on narrow screens). Every dialog
     uses it; export re-sets it with #exportdlg. */
  .mi-header { padding-right: 24px; }
  @media (max-width: 600px) {
    .mi-header { padding-right: 16px; }
  }

  /* Menu: position fixed (placed by JS) so the card does not clip it; one column of titled groups with round pills.
     .menu .pill must stay in the overrides layer: the dialog-layer .pill (port pills) also matches menu pills. */
  .menu { position: fixed; overflow-y: auto; width: min(300px, calc(100vw - 16px)); min-width: 0; padding: 4px 14px 10px; }
  .menu-group { padding: 12px 0 2px; }
  .menu-group + .menu-group { border-top: 1px solid var(--divider-color); margin-top: 10px; }
  .menu-label { padding: 0 2px 8px; }
  .menu-pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .menu .pill {
    /* The size of every button (11-components.css .btn): 34 px, 12.5 px, weight 500, text 1 px lower. */
    display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--divider-color); box-sizing: border-box;
    min-height: 34px; padding: 2px 10px 0; font-size: 12.5px; font-weight: 500; line-height: 1;
    background: transparent; color: var(--primary-text-color); border-radius: 999px; cursor: pointer; font-family: inherit;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s;
  }
  .menu .pill:hover { background: var(--ha-hover); }
  .menu-pills .pill { width: auto; white-space: nowrap; }
  .menu .pill.lg { flex: 1 1 0; min-width: 0; }
  .menu .pill[aria-pressed="true"] { background: var(--primary-color); border-color: var(--primary-color); color: #fff; cursor: default; }
  .menu .pill.md { flex: 1 1 0; min-width: 0; padding: 2px 8px 0; }
  /* Speed buttons: the name and, under it, how often the check runs. */
  .menu .pill.speed { flex-direction: column; gap: 1px; min-height: 46px; padding: 5px 8px; line-height: 1.2; }      /* two lines (name and how often): the only taller one */
  .menu .pill.speed .pill-sub { font-size: 11px; opacity: 0.7; font-variant-numeric: tabular-nums; }
  .menu .pill.speed[aria-pressed="true"] .pill-sub { opacity: 0.85; }
  /* Pause menu pill at full width (it is "lg full": must come after .menu .pill.lg). */
  .menu .pill.full { flex: 1 1 100%; }
  .menu-hint { padding: 8px 2px 0; font-size: 12px; color: var(--secondary-text-color); }
  /* The foot of the menu: same box as the rows above (margin, divider, padding 12/2/4), so the text starts and the icon ends where theirs do. On the left the
     repository, small and quiet; on the right, only while there is an update, the red arrow (18 px, like the icons of the rows). */
  .menu-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; padding: 12px 2px 4px; border-top: 1px solid var(--divider-color); }
  .menu-repo { display: inline-flex; align-items: center; gap: 6px; min-width: 0; font-size: var(--ha-font-size-s); letter-spacing: 0.02em; color: var(--secondary-text-color);
    text-decoration: none; transition: color 0.15s; }
  .menu-repo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu-repo .mdi { width: 14px; height: 14px; flex: none; opacity: 0.7; }
  .menu-repo:hover { color: var(--primary-color); }
  .menu-repo:focus-visible { outline: 2px solid var(--focus-color); outline-offset: 2px; border-radius: 4px; }
  .menu-upd { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; margin: 0; padding: 0; border: 0; border-radius: 4px;
    background: transparent; color: var(--error-color); cursor: pointer; transition: transform 0.15s; }
  .menu-upd .mdi { width: 18px; height: 18px; }
  .menu-upd:hover { transform: translateY(-1px); }
  .menu-upd:focus-visible { outline: 2px solid var(--focus-color); outline-offset: 2px; }

  /* Menu entries that open a dialog: one line each, one under the other, icon on the right. */
  .menu-link { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-top: 10px; padding: 12px 2px 4px;
    border: 0; border-top: 1px solid var(--divider-color); border-radius: 0; background: transparent; color: var(--primary-text-color); font: inherit; cursor: pointer; }
  .menu-link:hover { color: var(--primary-color); }
  .menu-link .mdi { width: 18px; height: 18px; color: var(--secondary-text-color); }
  /* the number of ignored devices (same look as the count of a group) */
  .menu-count { display: inline-block; margin-left: 6px; padding: 0 8px; border-radius: 9px; font-size: 12px; font-weight: 500; line-height: 18px; vertical-align: 1px; color: var(--secondary-text-color); background: color-mix(in srgb, var(--secondary-text-color) 16%, transparent); }
  .menu-link.next { margin-top: 0; border-top: 0; padding-top: 8px; }
  /* The download arrow fills only 71% of its box (the cog 83%, the crossed eye 92%): a larger box gives it the same apparent size, and the negative margin keeps its centre and the row height. */
  .menu-link.menu-export .mdi { width: 21px; height: 21px; margin: -1.5px -1.5px -1.5px 0; }

  /* The one-time invitation to star the project: a small star on the menu button (over the page, nothing moves) and the first entry of the menu. */
  .star-badge { position: absolute; top: 3px; right: 3px; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; border-radius: 50%;
    background: var(--card-background-color); box-shadow: 0 0 0 2px var(--card-background-color); color: var(--warning-color); pointer-events: none;
    animation: star-ping 2.4s ease-out infinite; }
  .star-badge[hidden] { display: none; }
  .star-badge .mdi { width: 12px; height: 12px; color: inherit; }
  /* The update dot: a red dot at the lower right of the menu button, over the page (nothing moves); it goes away when the menu is opened. */
  .upd-dot { position: absolute; bottom: 5px; right: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--error-color);
    box-shadow: 0 0 0 2px var(--card-background-color); pointer-events: none; }
  .upd-dot[hidden] { display: none; }
  @keyframes star-ping { 0% { box-shadow: 0 0 0 2px var(--card-background-color), 0 0 0 2px color-mix(in srgb, var(--warning-color) 55%, transparent); }
    100% { box-shadow: 0 0 0 2px var(--card-background-color), 0 0 0 12px transparent; } }
  .menu-link.star-entry { margin-top: 0; padding: 12px 2px; border-top: 0; border-bottom: 1px solid var(--divider-color); text-decoration: none; }
  .star-entry .star-text small { display: block; margin-top: 1px; font-size: 12px; color: var(--secondary-text-color); }
  .menu-link.star-entry .mdi { width: 22px; height: 22px; color: var(--warning-color); }
  @media (prefers-reduced-motion: reduce) { .star-badge { animation: none; } }

  /* Themed select (the language in the menu, and any selection that comes): the button looks like a field, the list like the menu. */
  .sel-btn { position: relative; display: flex; align-items: center; width: 100%; height: 34px; padding: 2px 40px 0 44px; border: 1px solid var(--divider-color); border-radius: 17px;
    background: transparent; color: var(--primary-text-color); font: inherit; font-size: 12.5px; font-weight: 500; text-align: left; cursor: pointer; }
  .sel-btn:hover { background: var(--ha-hover); }

  .sel-btn[aria-expanded="true"] { border-color: var(--primary-color); }
  .sel-btn .sel-ic, .sel-btn .sel-chev { top: 0; bottom: 0; margin-block: auto; }      /* centred in the box whatever the padding on top (the text is 1 px lower) */
  .sel-btn .sel-ic { position: absolute; left: 14px; width: 20px; height: 20px; color: var(--secondary-text-color); }
  .sel-btn .sel-chev { position: absolute; right: 12px; width: 20px; height: 20px; color: var(--secondary-text-color); transition: transform 0.15s; }
  .sel-btn[aria-expanded="true"] .sel-chev { transform: rotate(180deg); }
  .sel-list { position: fixed; z-index: 60; margin: 0; padding: 4px 0; list-style: none; box-sizing: border-box; overflow-y: auto; max-height: 60vh;
    background: var(--card-background-color); border: 1px solid var(--divider-color); border-radius: 12px; transform-origin: top center; animation: pop-in 0.14s ease-out;
    box-shadow: 0 5px 5px -3px rgba(0, 0, 0, 0.2), 0 8px 10px 1px rgba(0, 0, 0, 0.14), 0 3px 14px 2px rgba(0, 0, 0, 0.12); }
  .sel-list:focus { outline: none; }
  .sel-li { display: flex; align-items: center; justify-content: space-between; min-height: 44px; margin: 0 4px; padding: 0 12px; border-radius: 8px; color: var(--primary-text-color); cursor: pointer; }
  .sel-li.act { background: var(--ha-hover); }
  .sel-li[aria-selected="true"] { color: var(--primary-color); }
  .sel-li .mdi { width: 20px; height: 20px; visibility: hidden; }
  .sel-li[aria-selected="true"] .mdi { visibility: visible; }

  /* Visual polish, shared part: focus ring, card titles, search, touch target. */
  :focus-visible { outline-color: var(--focus-color); }
  /* Plainer card titles (every .ch-title is in a .card-header, where .card-header .ch-title below wins) */
  .ch-title { font-size: 20px; line-height: 28px; letter-spacing: 0; }
  /* Search: filled field without border */
  .search { border: 0; background: color-mix(in srgb, var(--primary-text-color) 8%, transparent); }
  .search:focus-within { box-shadow: 0 0 0 2px var(--focus-color); }
  /* Touch target */
  .snack-action { min-height: 44px; }

  /* Values read from the Home Assistant frontend source (ha-card.ts, hass-subpage.ts, ha-icon-button.ts, ha-button.ts,
     typography.globals.ts): .card-header 24 px / 1.2 / weight 400; bar: title 20 px, 48 px buttons, 12 px padding; buttons and
     chips 14 px. */
  .card-header { padding: 20px 8px 20px 16px; gap: 8px; }
  .card-header.slim { padding: 16px 16px 8px; }
  .card-header .ch-title { font-size: 24px; line-height: 1.2; font-weight: 400; letter-spacing: -0.012em; }
  .card-header .ch-title.small, .card-header.slim .ch-title { font-size: 20px; line-height: 1.2; font-weight: 500; letter-spacing: 0; }
  .card-header .ch-sub { font-size: 14px; line-height: 1.6; margin-top: 4px; }
  .icon-btn.small { width: 48px; height: 48px; }
  .icon-btn.small .mdi, .icon-btn .mdi { width: 24px; height: 24px; }
  .ch-ic { width: 48px; height: 48px; }

  /* Fixed debug-mode badge: always visible, in a corner, above everything. */
  #debug-badge {
    position: fixed; z-index: 9999; left: 12px; bottom: 12px; padding: 4px 12px; border-radius: 16px;
    background: var(--warning-color); color: #000; font-size: 13px; font-weight: 700; letter-spacing: 0.08em;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4); pointer-events: none;
  }

  /* Every dialog body is the containing block of the evidence pop-up and of the brand logo of the sheet. */
  .mi { position: relative; }

  /* Shared blink: used by the busy scan button (tiles) and the paused live LED (network). Kept in the overrides layer where it was
     defined. */
  @keyframes nd-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
}
