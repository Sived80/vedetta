name: Tests

on:
  push:
    branches:
      - main
      - release/**
      - ci/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04    # 26.04 (the new ubuntu-latest, from 19/10/2026) breaks the two export golden tests: to study
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0    # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: vedetta/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1    # v7.1.0
        with:
          node-version: "22"
      - run: pip install -r vedetta/requirements.txt
      - run: npm ci
        working-directory: tests/ui
      - run: python tools/run_tests.py
