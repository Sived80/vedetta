configuration:
  log_level:
    name: "Log"
    description: "How much the app writes to its log."
  interface:
    name: "Network · Interface"
    description: "Empty = automatic (for example eth0)."
  internet_public_ip:
    name: "Internet · Public IP"
    description: "Asks OpenDNS for your public IP. Off: nothing leaves."
  internet_path:
    name: "Internet · Path"
    description: "Traceroute to spot double NAT or CGNAT. Off: nothing leaves."
  internet_path_target:
    name: "Internet · Target"
    description: "Address for the traceroute. Empty = 1.1.1.1."
  internet_mac_database:
    name: "Internet · MAC makers"
    description: "Downloads the IEEE list every 30 days. Off: uses the bundled one."
  mqtt_host:
    name: "MQTT · Address"
    description: "Your own broker. Empty = Home Assistant MQTT service."
  mqtt_port:
    name: "MQTT · Port"
    description: "Usually 1883."
  mqtt_username:
    name: "MQTT · User"
    description: "Only if the broker needs a user."
  mqtt_password:
    name: "MQTT · Password"
    description: "Only if the broker needs a password."
